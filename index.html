<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Control EGIS Maule · en vivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d3a5f'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EEG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --surface-3:#eaeff3;
  --ink:#0f161c; --ink-2:#4a5560; --ink-3:#7c8892;
  --line:#dbe2e8; --line-2:#c2ccd5;
  --accent:#1d4e76; --accent-ink:#ffffff; --accent-soft:#e2edf6; --accent-line:#a9c7de;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e4f5e4; --warn-soft:#fdf3dd; --crit-soft:#fae4e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --grid:#e6ebef; --axis:#c2ccd5;
  --shadow:0 1px 2px rgba(15,22,28,.06), 0 8px 24px -12px rgba(15,22,28,.18);
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0b0f13; --surface:#141a20; --surface-2:#1a2128; --surface-3:#212a32;
  --ink:#eef2f5; --ink-2:#a7b2bb; --ink-3:#77838c;
  --line:#242e37; --line-2:#33404a;
  --accent:#7fb2dd; --accent-ink:#08131c; --accent-soft:#152736; --accent-line:#2b4459;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#11291a; --warn-soft:#2e2513; --crit-soft:#2e1616;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --grid:#212a32; --axis:#33404a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b0f13; --surface:#141a20; --surface-2:#1a2128; --surface-3:#212a32;
  --ink:#eef2f5; --ink-2:#a7b2bb; --ink-3:#77838c;
  --line:#242e37; --line-2:#33404a;
  --accent:#7fb2dd; --accent-ink:#08131c; --accent-soft:#152736; --accent-line:#2b4459;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#11291a; --warn-soft:#2e2513; --crit-soft:#2e1616;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --grid:#212a32; --axis:#33404a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.012em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .glyph{width:26px;height:26px;flex:none;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Archivo;font-weight:700;font-size:12px;letter-spacing:.02em}
.brand h1{font-size:14.5px;font-weight:700;line-height:1.15}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px}
.navlab{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:12px 8px 5px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
:root[data-theme="dark"] .navbtn.on,:root:not([data-theme="light"]) .navbtn.on{color:var(--ink)}
.navbtn svg{flex:none;opacity:.85}
.navbtn .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.railfoot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:7px}
.main{min-width:0;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h2{font-size:16px;font-weight:600}
.top .spacer{flex:1}
.progsel{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 9px}
.progsel select{border:0;background:none;font-weight:600;font-size:13px;max-width:280px;cursor:pointer;outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:100px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent);color:color-mix(in srgb,var(--good) 72%,var(--ink))}
.chip.wa{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:color-mix(in srgb,var(--warn) 55%,var(--ink))}
.chip.cr{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent);color:color-mix(in srgb,var(--crit) 75%,var(--ink))}
.view{padding:22px;max-width:1500px;width:100%}

/* ---------- generic ---------- */
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,.navbtn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:var(--surface);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h3{font-size:13.5px;font-weight:600}
.panel>header .hint{font-size:11.5px;color:var(--ink-3)}
.panel>header .spacer{flex:1}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.scroll{overflow-x:auto}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:Archivo;font-size:29px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.stat .v small{font-size:15px;font-weight:500;color:var(--ink-3);margin-left:1px}
.stat .m{font-size:12px;color:var(--ink-2)}
.meter{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}

/* ---------- tables ---------- */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.rowbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
:root[data-theme="dark"] .rowbtn,:root:not([data-theme="light"]) .rowbtn{color:var(--ink)}
.rowbtn:hover{text-decoration:underline}
.bar{display:flex;align-items:center;gap:8px;min-width:118px}
.bar .track{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar .fill{height:100%;border-radius:3px}
.bar b{font-size:12px;font-weight:600;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:50%;flex:none}

/* ---------- matrix ---------- */
.matrix{font-size:12px}
.matrix th{padding:6px 4px;text-align:center}
.matrix th.rot{height:120px;vertical-align:bottom;padding-bottom:8px;width:32px;min-width:32px}
.matrix th.rot span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:10.5px;letter-spacing:.03em;text-transform:none;font-weight:600}
.matrix td{padding:0;text-align:center;border-right:1px solid var(--line)}
.matrix td.name,.matrix th.name{text-align:left;padding:6px 10px;position:sticky;left:0;background:var(--surface);z-index:1;border-right:1px solid var(--line-2);min-width:230px}
.matrix tbody tr:hover td.name{background:var(--surface-2)}
.cell{width:100%;height:30px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.cell i{width:15px;height:15px;border-radius:3px;display:block;border:1px solid transparent}
.cell:hover i{transform:scale(1.22);transition:transform .08s}
.st-completa i{background:var(--good);border-color:color-mix(in srgb,var(--good) 70%,#000)}
.st-parcial i{background:var(--warn);border-color:color-mix(in srgb,var(--warn) 65%,#000)}
.st-no i{background:var(--surface-3);border-color:var(--line-2)}
.st-si i{background:var(--accent);border-color:var(--accent)}
.st-na i{background:color-mix(in srgb,var(--crit) 16%,transparent);border-color:var(--crit);position:relative}
.st-na i::before,.st-na i::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:1.6px;background:var(--crit);border-radius:1px}
.st-na i::before{transform:rotate(45deg)}
.st-na i::after{transform:rotate(-45deg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block;border:1px solid transparent}

/* ---------- charts ---------- */
.chartwrap{padding:14px 16px 6px}
svg text{font-family:"Source Sans 3",sans-serif}
.axlab{font-size:11px;fill:var(--ink-3)}
.vallab{font-size:11px;fill:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--axis);stroke-width:1}
.stagerow{cursor:default}
.stagerow:hover .rowbg{fill:var(--surface-2)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,19,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(720px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.drawer header h3{font-size:16px;font-weight:700}
.drawer header .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.drawer .body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer .body>*{flex:0 0 auto}
.drawer input,.drawer textarea,.drawer .seg button,.cell{pointer-events:none}
.drawer input,.drawer textarea{background:transparent;border-color:transparent;padding-left:0;color:var(--ink)}
.cell{cursor:default}
#view input,#view select,#view textarea,#view .seg button{pointer-events:none}
#view .seg button:not(.on){opacity:.45}
.x{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:20px;line-height:1;padding:2px 5px;border-radius:4px}
.x:hover{background:var(--surface-2);color:var(--ink)}
.stagelist{display:flex;flex-direction:column}
.stagerowe{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.stagerowe:last-child{border-bottom:0}
.stagerowe .nm{font-weight:600;font-size:13px}
.stagerowe .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-3)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2)}
.seg button.on{color:#fff}
.seg button.on.completa{background:var(--good)}
.seg button.on.parcial{background:var(--warn);color:#3a2a00}
.seg button.on.no{background:var(--line-2);color:var(--ink)}
.seg button.on.na{background:var(--crit);color:#fff}
.doc.na{background:color-mix(in srgb,var(--crit) 9%,transparent);border-color:var(--crit)}
.doc.na .t{color:var(--crit)}
.nabox{display:block;width:13px;height:13px;border-radius:3px;background:color-mix(in srgb,var(--crit) 16%,transparent);border:1px solid var(--crit);position:relative}
.nabox::before,.nabox::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1.6px;background:var(--crit);border-radius:1px}
.nabox::before{transform:rotate(45deg)}
.nabox::after{transform:rotate(-45deg)}
.na-tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--crit);border:1px solid var(--crit);border-radius:3px;padding:0 4px;vertical-align:1px;text-decoration:none}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.doc{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);cursor:pointer}
.doc.on{background:var(--accent-soft);border-color:var(--accent-line)}
.doc input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.doc .t{font-size:12.5px;font-weight:600}
.doc .d{font-size:11px;color:var(--ink-3);line-height:1.35}

.modal{position:fixed;z-index:45;top:50%;left:50%;transform:translate(-50%,-50%) scale(.97);width:min(620px,94vw);max-height:86vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .14s,transform .14s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.modal header h3{font-size:16px;font-weight:700}
.modal .mbody{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 10px 10px}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.diff div{background:var(--surface);padding:10px 12px}
.diff .k{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.diff .v{font-family:Archivo;font-size:22px;font-weight:600;line-height:1.1}
.log{max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:9px 11px;background:var(--surface-2);font-size:12px;line-height:1.55;color:var(--ink-2)}
.log b{color:var(--ink)}
.drop{border:2px dashed var(--line-2);border-radius:8px;padding:22px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer}
.drop.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* ---------- misc ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-width:210px}
.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:13px}
.alert{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border-bottom:0}
.alert .ic{width:20px;height:20px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.alert.cr .ic{background:var(--crit-soft);color:var(--crit)}
.alert.wa .ic{background:var(--warn-soft);color:color-mix(in srgb,var(--warn) 60%,var(--ink))}
.alert.ok .ic{background:var(--good-soft);color:var(--good)}
.alert .t{font-weight:600;font-size:13px}
.alert .d{font-size:12px;color:var(--ink-2)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.banner{display:flex;gap:10px;align-items:center;padding:9px 13px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);font-size:12.5px;margin-bottom:14px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;font-weight:500}
@media(max-width:1080px){.two,.three{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail,.main{min-width:0;max-width:100%}
  .rail{position:sticky;top:0;z-index:30;height:auto;border-right:0;border-bottom:1px solid var(--line);
        background:var(--surface);display:block;overflow:hidden}
  .brand{padding:9px 12px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:13.5px}

<script>
"use strict";
/* ============================================================
   Control EGIS · monitoreo de proyectos DS10 / Habitabilidad Rural
   Estado compartido en la base de datos del artifact (capacidad db).
   ============================================================ */

const EST = {completa:{lab:"Completa",w:1,cls:"completa"},parcial:{lab:"Parcial",w:.5,cls:"parcial"},no:{lab:"No realizada",w:0,cls:"no"},na:{lab:"No corresponde",w:0,cls:"na"}};
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6"];
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = n => Math.round(n*100);
const fmtDate = d => { if(!d) return "—"; const p=String(d).split("-"); return p.length===3? p[2]+"-"+p[1]+"-"+p[0] : d; };
const todayISO = () => new Date().toISOString().slice(0,10);

const S = {db:null, dl:null, ultima:null, recargando:false, progs:[], proys:[], progId:null, view:"panel", ready:false,
  filtro:{q:"",comuna:"",estado:"",resp:"",edec:"",grupo:""}, sort:{k:"numero",dir:1}, openId:null, autor:""};

/* ---------- cálculo ---------- */
function prog(){ return S.progs.find(p=>p.id===S.progId) || S.progs[0] || null; }
function proyectos(){ return S.proys.filter(p=>p.programaId===S.progId).sort((a,b)=>(a.numero||0)-(b.numero||0)); }
function esNA(v){ return !!v && (v.estado==="na" || v.na===true); }
function avEtapas(p,pg){
  const et = pg && pg.etapas || []; if(!et.length) return 0;
  let s=0,n=0;
  for(const e of et){ const v=(p.etapas||{})[e.id]; if(esNA(v)) continue; n++; s += (EST[(v&&v.estado)||"no"]||EST.no).w; }
  return n? s/n : 1;
}
function avDocs(p,pg){
  const bl = pg && pg.bloques || []; if(!bl.length) return 0;
  let s=0,n=0;
  for(const b of bl){ const v=(p.bloques||{})[b.id]||{}; if(esNA(v)) continue; n++; if(v.cargado) s++; }
  return n? s/n : 1;
}
function contarNA(p,pg){
  const et=(pg&&pg.etapas)||[], bl=(pg&&pg.bloques)||[];
  return et.filter(e=>esNA((p.etapas||{})[e.id])).length + bl.filter(b=>esNA((p.bloques||{})[b.id])).length;
}
function diasPlazo(pg){
  if(!pg||!pg.plazo) return null;
  const t=new Date(pg.plazo+"T12:00:00"), h=new Date(todayISO()+"T12:00:00");
  return Math.round((t-h)/86400000);
}
function nivel(a){ return a>=1?"ok" : a>=.5?"wa" : a>0?"wa" : "cr"; }
function colorAvance(a){ return a>=1?"var(--good)" : a>=.6?"var(--s3)" : a>=.3?"var(--warn)" : a>0?"var(--serious)":"var(--line-2)"; }

/* ---------- persistencia ---------- */
async function guardarProy(p, campos){ return;
async function _n1(){
  Object.assign(p, campos, {updatedAt:new Date().toISOString(), updatedBy:S.autor||"—"});
  render();
  if(!S.db) return;
  try{ await S.db.doc("proyectos/"+p.id).set(JSON.parse(JSON.stringify(p))); }
  catch(e){ aviso("No se pudo guardar el proyecto: "+(e.message||e.code)); }
}
}
async function guardarProg(pg, campos){ return;
async function _n2(){
  Object.assign(pg, campos, {updatedAt:new Date().toISOString()});
  render();
  if(!S.db) return;
  try{ await S.db.doc("programas/"+pg.id).set(JSON.parse(JSON.stringify(pg))); }
  catch(e){ aviso("No se pudo guardar el programa: "+(e.message||e.code)); }
}
}
let avisoT;
function aviso(msg){
  const el=$("#syncState"); if(!el) return;
  el.textContent=msg; el.style.color="var(--crit)";
  clearTimeout(avisoT); avisoT=setTimeout(estadoSync,6000);
}
function estadoSync(){ return;
  const el=$("#syncState"); if(!el) return;
  el.style.color="";
  const hora = S.ultima? S.ultima.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}) : "—";
  el.innerHTML = S.db
    ? '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:50%;background:var(--good);display:block"></i>En línea · datos de las '+hora+'</span>'
    : '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:7px;height:7px;border-radius:50%;background:var(--crit);display:block"></i>Sin conexión a la base de datos</span>';
}
/* Relectura manual: por si la actualización automática se cae o queda pegada. */
async function recargar(manual){
  const btn=$("#reloadBtn");
  if(!S.db){ aviso("No hay conexión con la base de datos. Recarga la página (F5) para reintentar."); return; }
  if(S.recargando) return;
  S.recargando=true;
  if(btn){ btn.disabled=true; btn.style.opacity=".6"; }
  try{
    const [sp,sy]=await Promise.all([
      S.db.collection("programas").get(),
      S.db.collection("proyectos").limit(1000).get()
    ]);
    S.progs = sp.docs.map(d=>Object.assign({id:d.id}, d.data()));
    S.proys = sy.docs.map(d=>Object.assign({id:d.id}, d.data()));
    ordenarProgs();
    if(!S.progId || !S.progs.some(x=>x.id===S.progId)) S.progId=(S.progs[0]||{}).id||null;
    S.ultima=new Date(); S.ready=true;
    render(); if(S.openId) pintarDrawer();
    if(manual){ const el=$("#syncState"); el.style.color="";
      el.innerHTML='<span style="color:var(--good);font-weight:600">Datos actualizados · '+S.proys.length+' proyectos</span>';
      setTimeout(estadoSync,3000); }
  }catch(e){
    aviso("No se pudieron releer los datos: "+(e.message||e.code||e));
  }finally{
    S.recargando=false;
    if(btn){ btn.disabled=false; btn.style.opacity=""; }
  }
}
</script>
<script>
/* ============================ VISTAS ============================ */
const TITULOS = {panel:"Panel de control",proyectos:"Proyectos y beneficiarios",etapas:"Matriz de etapas",docs:"Carpeta documental",avtec:"Avance Técnico · obra y módulo de postulación",cartera:"Cartera crítica · detalle de expedientes",evaluacion:"Evaluación previa del encargo",fuentes:"Fuentes de datos",reportes:"Reportes",config:"Configuración"};

function render(){
  const pg = prog();
  navGate(pg);
  $("#viewTitle").textContent = TITULOS[S.view];
  $("#cntProy").textContent = pg ? proyectos().length : "";
  renderPlazo(pg);
  renderFresco(pg);
  renderProgSel();
  const v = $("#view");
  if(!S.ready){ v.innerHTML = '<div class="empty">Cargando datos…</div>'; return; }
  if(!pg){ v.innerHTML = vistaVacia(); return; }
  v.innerHTML = ({panel:vPanel,proyectos:vProyectos,etapas:vEtapas,docs:vDocs,avtec:vAvanceTecnico,cartera:vCartera,evaluacion:vEval,fuentes:vFuentes,reportes:vReportes,config:vConfig})[S.view](pg);
  if(!S.dl) v.querySelectorAll("[data-dl]").forEach(b=>b.remove());
  if(S.view==="panel") dibujarGraficos(pg);
  if(S.view==="reportes") dibujarGraficosReporte(pg);
}
function navGate(pg){
  const ps = pg? proyectos() : [];
  const tieneCC   = ps.some(p=>p.cc && Object.keys(p.cc).length);
  const tieneAT   = ps.some(p=>p.at && p.at.obra);
  const vis = {cartera:tieneCC, avtec:tieneAT};
  document.querySelectorAll(".navbtn").forEach(b=>{
    const k=b.dataset.v;
    if(k in vis) b.style.display = vis[k]? "" : "none";
  });
  if(S.view in vis && !vis[S.view]) S.view="panel";
  syncNav();
}
function vistaVacia(){
  return '<div class="panel"><div class="empty"><p style="font-size:15px;color:var(--ink);font-weight:600;margin:0 0 6px">Aún no hay ningún encargo cargado</p><p style="margin:0 0 14px">Crea el primer programa para empezar a registrar proyectos.</p><button class="btn pri" onclick="nuevoPrograma()">Crear programa</button></div></div>';
}
function renderProgSel(){
  const s=$("#progSel");
  s.innerHTML = S.progs.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===S.progId?" selected":"")+'>'+esc(p.nombre)+'</option>').join("")
    || '<option>Sin programas</option>';
}
function corteDe(pg){
  const ps=(S.proys||[]).filter(p=>p.programaId===(pg&&pg.id));
  let max="";
  ps.forEach(p=>{
    const c=(p.at&&p.at.actualizado)||p.updatedAt||"";
    if(c>max) max=c;
  });
  return max;
}
function renderFresco(pg){
  const c=$("#frescoChip"); if(!c) return;
  const iso=corteDe(pg);
  if(!iso){ c.style.display="none"; return; }
  c.style.display="";
  const d=new Date(iso.length<=10? iso+"T12:00:00" : iso);
  const horas=(Date.now()-d.getTime())/3600000;
  const cls = horas<30? "ok" : horas<80? "wa" : "cr";
  const txt = horas<1.5? "hace unos minutos"
            : horas<24? "hace "+Math.round(horas)+" h"
            : horas<48? "ayer"
            : "hace "+Math.round(horas/24)+" días";
  c.className="chip "+cls;
  c.textContent="Datos leídos "+txt;
  c.title="Última lectura de las carpetas y planillas de OneDrive: "+d.toLocaleString("es-CL")+
          ". La página muestra siempre lo último que dejó la sincronización; no entra a OneDrive por sí sola.";
}
function renderPlazo(pg){
  const c=$("#plazoChip"), d=diasPlazo(pg);
  if(d===null){ c.className="chip"; c.textContent="Plazo comprometido sin definir"; return; }
  const cls = d<0?"cr" : d<=30?"cr" : d<=60?"wa":"ok";
  c.className="chip "+cls;
  c.textContent = d<0 ? "Plazo vencido hace "+Math.abs(d)+" días"
    : d===0 ? "El plazo vence hoy"
    : d+" días para el plazo comprometido";
}

/* ---------------- PANEL ---------------- */
function etapaActual(p,pg){
  const es=pg.etapas||[]; const tot=es.length;
  let listas=0, prox=null;
  for(let i=0;i<tot;i++){
    const st=(p.etapas||{})[es[i].id]||{};
    if(st.estado==="na" || /no aplica|no corresponde/i.test(st.nota||st.respaldo||"")){ listas++; continue; }
    if(st.estado==="completa"){ listas++; continue; }
    if(!prox) prox={i:i+1,nombre:es[i].nombre,estado:st.estado||"no"};
  }
  return {i:prox?prox.i:tot, tot, listas, nombre: prox? prox.nombre : "Proceso terminado", estado: prox? prox.estado : "completa"};
}
const TRAMOS=[
  {k:"fin", lab:"Terminado",        col:"var(--good)",    test:a=>a>=1},
  {k:"alt", lab:"Avanzado",         col:"var(--s1)",      test:a=>a>=.7&&a<1},
  {k:"med", lab:"A medio camino",   col:"var(--warn)",    test:a=>a>=.34&&a<.7},
  {k:"ini", lab:"Recién iniciado",  col:"var(--serious)", test:a=>a>0&&a<.34},
  {k:"cero",lab:"Sin avance",       col:"var(--crit)",    test:a=>a<=0}
];
function tramoDe(a){ return TRAMOS.find(t=>t.test(a)) || TRAMOS[4]; }

function vPanel(pg){
  const ps=proyectos(), n=ps.length;
  if(!n) return '<div class="panel"><div class="empty">Esta cartera todavía no tiene beneficiarios cargados.</div></div>';
  const avg = ps.reduce((s,p)=>s+avEtapas(p,pg),0)/n;
  const avgD = ps.reduce((s,p)=>s+avDocs(p,pg),0)/n;
  const d = diasPlazo(pg);

  const conAv = ps.map(p=>({p, a:avEtapas(p,pg), dd:avDocs(p,pg)}));
  const cuenta={}; TRAMOS.forEach(t=>cuenta[t.k]=0);
  conAv.forEach(x=>cuenta[tramoDe(x.a).k]++);
  const comp=cuenta.fin, cero=cuenta.cero, marcha=n-comp-cero;
  const criticos = conAv.filter(x=>x.a<.34).sort((a,b)=>a.a-b.a);
  const comunas = agrupaComunas(ps,pg);
  const grupos = new Set(ps.map(p=>p.grupo).filter(Boolean));

  /* --------- alertas, siempre habladas en personas --------- */
  const etapasCriticas = (pg.etapas||[]).map(e=>{
    const c={completa:0,parcial:0,no:0};
    ps.forEach(p=>{ c[((p.etapas||{})[e.id]||{}).estado||"no"]++; });
    return {e,c,av:(c.completa+c.parcial*.5)/n};
  }).sort((a,b)=>a.av-b.av);
  const bloquesFaltantes = (pg.bloques||[]).map(b=>({b, f: ps.filter(p=>!((p.bloques||{})[b.id]||{}).cargado).length}))
    .filter(x=>x.f>0).sort((a,b)=>b.f-a.f);

  let alertas=[];
  if(d!==null && d<0) alertas.push(["cr","!","El plazo se venció hace "+Math.abs(d)+" días","Quedan "+(n-comp)+" de "+n+" personas sin terminar su proceso."]);
  else if(d!==null && d<=45) alertas.push([d<=20?"cr":"wa",d,"Quedan "+d+" días de plazo","Hay "+(n-comp)+" personas todavía en proceso."]);
  if(cero) alertas.push(["cr",cero,cero+(cero>1?" personas no han empezado":" persona no ha empezado"),"No registran ninguna etapa iniciada de las "+(pg.etapas||[]).length+" del proceso."]);
  if(criticos.length && criticos.length!==cero) alertas.push(["wa",criticos.length,criticos.length+" personas van bajo el 34%","Son las que arrastran el promedio de la cartera ("+pct(avg)+"%)."]);
  etapasCriticas.slice(0,2).forEach(x=>{ if(x.av<.25) alertas.push(["wa",x.c.no,
    x.c.no===n? "Nadie ha empezado «"+x.e.nombre+"»" : x.c.no+" personas detenidas en «"+x.e.nombre+"»",
    x.c.no===n? "Ninguna de las "+n+" personas registra avance en esa etapa." : "Es la etapa donde más gente está detenida."]); });
  bloquesFaltantes.slice(0,2).forEach(x=>{ if(x.f> n*0.5) alertas.push(["wa",x.f,
    x.f===n? "Ninguna carpeta tiene «"+x.b.nombre+"»" : x.f+" personas sin «"+x.b.nombre+"»",
    x.f===n? "Falta ese documento en las "+n+" carpetas de la cartera." : "Falta ese documento en su carpeta."]); });
  const sinResp = ps.filter(p=>!p.responsable).length;
  if(sinResp) alertas.push(["wa",sinResp,sinResp+(sinResp>1?" personas sin responsable":" persona sin responsable"),"Nadie figura a cargo de su seguimiento."]);
  if(!alertas.length) alertas.push(["ok","✓","Sin alertas activas","Todas las personas avanzan dentro de los umbrales definidos."]);

  const filas = conAv.slice().sort((a,b)=>a.a-b.a || String(a.p.postulante||"").localeCompare(String(b.p.postulante||"")));
  const hayGrupo = grupos.size>1;
  const hayEstado = ps.some(p=>p.estado);
  const hayResp = ps.some(p=>p.responsable);

  return `
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><div class="k">Personas en la cartera</div><div class="v">${n}</div>
      <div class="m">${Object.keys(comunas).length} comuna${Object.keys(comunas).length>1?"s":""}${hayGrupo?" · "+grupos.size+" grupos":""}</div></div>
    <div class="stat"><div class="k">Terminaron su proceso</div><div class="v" style="color:var(--good)">${comp}</div>
      <div class="meter"><i style="width:${Math.round(comp/n*100)}%;background:var(--good)"></i></div>
      <div class="m">${Math.round(comp/n*100)}% de la cartera</div></div>
    <div class="stat"><div class="k">En marcha</div><div class="v">${marcha}</div>
      <div class="meter"><i style="width:${Math.round(marcha/n*100)}%;background:var(--warn)"></i></div>
      <div class="m">Con al menos una etapa avanzada</div></div>
    <div class="stat"><div class="k">Sin empezar</div><div class="v" style="color:${cero?"var(--crit)":"var(--ink)"}">${cero}</div>
      <div class="meter"><i style="width:${Math.round(cero/n*100)}%;background:var(--crit)"></i></div>
      <div class="m">Ninguna etapa registrada</div></div>
    <div class="stat"><div class="k">Plazo comprometido</div><div class="v">${d===null?"—":(d<0?"−"+Math.abs(d):d)}<small>${d===null?"":" días"}</small></div>
      <div class="m">${pg.plazo? fmtDate(pg.plazo) : "Sin definir"}</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>Cómo va cada persona</h3><span class="hint">${n} beneficiarios · de menor a mayor avance</span><span class="spacer"></span>
      <button class="btn sm" onclick="ir('proyectos')">Ficha completa</button></header>
    <div class="pad" style="padding-bottom:10px">
      <div style="display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)">
        ${TRAMOS.filter(t=>cuenta[t.k]).map(t=>`<div title="${t.lab}: ${cuenta[t.k]}" style="width:${cuenta[t.k]/n*100}%;background:${t.col};display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700">${cuenta[t.k]/n>=.06?cuenta[t.k]:""}</div>`).join("")}
      </div>
      <div class="legend" style="margin-top:9px">
        ${TRAMOS.map(t=>`<span><i style="background:${t.col}"></i>${t.lab} · <b style="color:var(--ink)">${cuenta[t.k]}</b></span>`).join("")}
      </div>
    </div>
    <div class="scroll" style="max-height:620px"><table class="cards">
      <thead><tr><th style="width:38px">N°</th><th>Beneficiario</th><th>Comuna</th>${hayGrupo?"<th>Grupo</th>":""}<th class="num">Etapas listas</th><th>Próximo paso</th><th style="width:150px">Avance del proceso</th><th class="num">Docs</th>${hayEstado?"<th>Estado declarado</th>":""}${hayResp?"<th>Responsable</th>":""}</tr></thead>
      <tbody>${filas.map(x=>{
        const t=tramoDe(x.a), ea=etapaActual(x.p,pg);
        return `<tr>
          <td class="mono tit-n" data-l="" style="color:var(--ink-3)">${esc(x.p.numero||"—")}</td>
          <td class="tit" data-l=""><button class="rowbtn" onclick="abrir('${esc(x.p.id)}')">${esc(x.p.postulante)}</button>
            <div style="font-size:11px;color:var(--ink-3)">${esc([x.p.comuna,x.p.localidad||x.p.rut].filter(Boolean).join(" · "))}</div></td>
          <td data-l="Comuna" class="solo-ancho">${esc(x.p.comuna||"—")}</td>
          ${hayGrupo?`<td data-l="Grupo" style="color:var(--ink-2)">${esc(x.p.grupo||"—")}</td>`:""}
          <td class="num mono" data-l="Etapas listas" style="color:var(--ink-2)"><span>${ea.listas}<span style="color:var(--ink-3)">/${ea.tot}</span></span></td>
          <td data-l="Próximo paso"><span class="tag"><i class="dot" style="background:${t.col}"></i>${x.a>=1?"Proceso terminado":esc(ea.nombre)}</span></td>
          <td data-l="Avance">${barra(x.a)}</td>
          <td class="num" data-l="Docs" style="color:var(--ink-2)">${pct(x.dd)}%</td>
          ${hayEstado?`<td data-l="Estado">${chipEstado(x.p.estado)}</td>`:""}
          ${hayResp?`<td data-l="Responsable" style="color:var(--ink-2)">${esc(x.p.responsable||"—")}</td>`:""}
        </tr>`;}).join("")}</tbody>
    </table></div>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start">
    <div style="display:flex;flex-direction:column;gap:14px">
    <div class="panel">
      <header><h3>Alertas</h3><span class="hint">${alertas.length} activa${alertas.length>1?"s":""}</span></header>
      <div>${alertas.slice(0,7).map(a=>`<div class="alert ${a[0]}"><div class="ic">${esc(String(a[1]))}</div><div><div class="t">${esc(a[2])}</div><div class="d">${esc(a[3])}</div></div></div>`).join("")}</div>
    </div>
    <div class="panel">
      <header><h3>Dónde se está atascando la gente</h3><span class="hint">personas detenidas en cada etapa</span></header>
      <div class="chartwrap"><div id="chEtapas"></div></div>
      <div class="pad" style="padding-top:0"><div class="legend">
        <span><i style="background:var(--good)"></i>Ya la pasaron</span>
        <span><i style="background:var(--warn)"></i>En curso</span>
        <span><i style="background:var(--surface-3);border-color:var(--line-2)"></i>Todavía no llegan</span>
      </div></div>
    </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel">
        <header><h3>Personas por comuna</h3><span class="hint">avance promedio de cada grupo</span></header>
        <div class="chartwrap"><div id="chComunas"></div></div>
      </div>
      ${(()=>{const ge=agrupaEstados(ps); if(ge.length<2) return "";
        return `<div class="panel"><header><h3>Estado declarado</h3><span class="hint">cuántas personas en cada estado</span></header>
        <div class="scroll"><table><tbody>${ge.map(x=>`<tr>
          <td>${chipEstado(x.lab==="Sin estado declarado"?"":x.lab)}${x.lab==="Sin estado declarado"?'<span style="color:var(--ink-3);font-size:12px">Sin estado declarado</span>':""}</td>
          <td style="width:110px"><div class="bar"><div class="track"><div class="fill" style="width:${Math.round(x.n/n*100)}%;background:${tonoEstado(x.lab)}"></div></div><b>${x.n}</b></div></td>
          </tr>`).join("")}</tbody></table></div></div>`;})()}
    </div>
  </div>`;
}

function filaMini(p,pg){
  const a=avEtapas(p,pg), dd=avDocs(p,pg);
  return `<tr><td class="mono" style="color:var(--ink-3)">${p.numero||"—"}</td>
    <td><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button></td>
    <td>${esc(p.comuna)}</td>
    <td>${barra(a)}</td><td class="num" style="color:var(--ink-2)">${pct(dd)}%</td>
    <td style="color:var(--ink-2)">${esc(p.responsable||"—")}</td></tr>`;
}
function barra(a){
  return `<div class="bar"><div class="track"><div class="fill" style="width:${pct(a)}%;background:${colorAvance(a)}"></div></div><b>${pct(a)}%</b></div>`;
}
const EST_TONO=[[/renuncia|no pago/i,"var(--crit)"],[/cerrado al 100|100% listo/i,"var(--good)"],[/^cerrado$/i,"var(--good)"],
  [/cerrado, falta|certificado .*pendiente|por cerrar|50% listo/i,"var(--s3)"],[/falta cierre 50|falta certificado 50/i,"var(--warn)"],
  [/falta cierre 100/i,"var(--serious)"]];
function tonoEstado(e){ for(const [re,c] of EST_TONO) if(re.test(e||"")) return c; return "var(--ink-3)"; }
function chipEstado(e){ return e? `<span class="tag"><i class="dot" style="background:${tonoEstado(e)}"></i>${esc(e)}</span>` : '<span style="color:var(--ink-3);font-size:12px">—</span>'; }
function agrupaEstados(ps){
  const g={}; ps.forEach(p=>{ const k=p.estado||"Sin estado declarado"; g[k]=(g[k]||0)+1; });
  return Object.keys(g).map(k=>({lab:k,n:g[k]})).sort((a,b)=>b.n-a.n);
}
function agrupaComunas(ps,pg){
  const g={};
  ps.forEach(p=>{ const c=p.comuna||"Sin comuna"; (g[c]=g[c]||[]).push(p); });
  return g;
}
</script>
<script>
/* ---------------- GRÁFICOS (SVG a mano, sin librerías) ---------------- */
function dibujarGraficos(pg){
  const ps=proyectos(), n=ps.length;
  const filas=(pg.etapas||[]).map(e=>{
    const c={completa:0,parcial:0,no:0};
    ps.forEach(p=>{ c[((p.etapas||{})[e.id]||{}).estado||"no"]++; });
    return {nombre:e.nombre,c,av:n?(c.completa+c.parcial*.5)/n:0};
  }).sort((a,b)=>a.av-b.av);
  const el=$("#chEtapas"); if(el) el.innerHTML = barrasApiladas(filas,n);
  const g=agrupaComunas(ps,pg);
  const datos=Object.keys(g).sort().map((k,i)=>({
    lab:k, n:g[k].length,
    av:g[k].reduce((s,p)=>s+avEtapas(p,pg),0)/g[k].length,
    doc:g[k].reduce((s,p)=>s+avDocs(p,pg),0)/g[k].length,
    color:"var("+SERIES[i%SERIES.length]+")"
  })).sort((a,b)=>b.av-a.av);
  const e2=$("#chComunas"); if(e2) e2.innerHTML = barrasComuna(datos);
}
function barrasApiladas(filas,n){
  if(!filas.length||!n) return '<div class="empty">Sin datos para graficar.</div>';
  const W=770,LW=252,rh=22,gap=5,H=filas.length*(rh+gap)+30, PW=W-LW-56;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:860px;display:block;height:auto" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Avance por etapa">`;
  [0,.25,.5,.75,1].forEach(t=>{
    const x=LW+t*PW;
    s+=`<line class="gridline" x1="${x}" y1="14" x2="${x}" y2="${H-18}"/>`;
    s+=`<text class="axlab" x="${x}" y="${H-5}" text-anchor="middle">${t*100}%</text>`;
  });
  filas.forEach((f,i)=>{
    const y=20+i*(rh+gap);
    const wc=f.c.completa/n*PW, wp=f.c.parcial/n*PW, wn=f.c.no/n*PW;
    s+=`<g class="stagerow"><rect class="rowbg" x="0" y="${y-3}" width="${W}" height="${rh+6}" fill="transparent"/>`;
    s+=`<text class="axlab" x="${LW-10}" y="${y+rh/2+4}" text-anchor="end" fill="var(--ink-2)">${esc(trunc(f.nombre,40))}</text>`;
    let x=LW;
    if(wc>0){ s+=`<rect x="${x}" y="${y}" width="${Math.max(wc-2,1)}" height="${rh}" rx="3" fill="var(--good)"><title>${esc(f.nombre)} — Completa: ${f.c.completa} de ${n}</title></rect>`; x+=wc; }
    if(wp>0){ s+=`<rect x="${x}" y="${y}" width="${Math.max(wp-2,1)}" height="${rh}" rx="3" fill="var(--warn)"><title>${esc(f.nombre)} — Parcial: ${f.c.parcial} de ${n}</title></rect>`; x+=wp; }
    if(wn>0){ s+=`<rect x="${x}" y="${y}" width="${Math.max(wn-2,1)}" height="${rh}" rx="3" fill="var(--surface-3)" stroke="var(--line-2)" stroke-width="1"><title>${esc(f.nombre)} — No realizada: ${f.c.no} de ${n}</title></rect>`; }
    s+=`<text class="vallab" x="${LW+PW+8}" y="${y+rh/2+4}">${pct(f.av)}%</text></g>`;
  });
  s+=`<line class="baseline" x1="${LW}" y1="14" x2="${LW}" y2="${H-18}"/></svg>`;
  return s;
}
function barrasComuna(d){
  if(!d.length) return '<div class="empty">Sin datos.</div>';
  const W=430,LW=112,rh=26,gap=13,H=d.length*(rh+gap)+30,PW=W-LW-56;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:560px;display:block;height:auto" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Avance por comuna">`;
  [0,.5,1].forEach(t=>{const x=LW+t*PW;
    s+=`<line class="gridline" x1="${x}" y1="12" x2="${x}" y2="${H-18}"/><text class="axlab" x="${x}" y="${H-5}" text-anchor="middle">${t*100}%</text>`;});
  d.forEach((f,i)=>{
    const y=18+i*(rh+gap);
    s+=`<text class="axlab" x="${LW-10}" y="${y+11}" text-anchor="end" fill="var(--ink)" style="font-weight:600">${esc(f.lab)}</text>`;
    s+=`<text class="axlab" x="${LW-10}" y="${y+23}" text-anchor="end">${f.n} proy.</text>`;
    s+=`<rect x="${LW}" y="${y}" width="${PW}" height="12" rx="3" fill="var(--surface-3)"/>`;
    s+=`<rect x="${LW}" y="${y}" width="${Math.max(f.av*PW,2)}" height="12" rx="3" fill="${f.color}"><title>${esc(f.lab)} — etapas ${pct(f.av)}%</title></rect>`;
    s+=`<rect x="${LW}" y="${y+15}" width="${PW}" height="6" rx="3" fill="var(--surface-3)"/>`;
    s+=`<rect x="${LW}" y="${y+15}" width="${Math.max(f.doc*PW,2)}" height="6" rx="3" fill="${f.color}" opacity=".45"><title>${esc(f.lab)} — documentos ${pct(f.doc)}%</title></rect>`;
    s+=`<text class="vallab" x="${LW+PW+8}" y="${y+11}">${pct(f.av)}%</text>`;
  });
  s+=`<line class="baseline" x1="${LW}" y1="12" x2="${LW}" y2="${H-18}"/></svg>`
   + '<div class="legend" style="padding:2px 0 10px"><span><i style="background:var(--ink-3)"></i>Barra gruesa: etapas</span><span><i style="background:var(--ink-3);opacity:.45"></i>Barra fina: documentos</span></div>';
  return s;
}
function trunc(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+"…" : s; }

/* ---------------- PROYECTOS ---------------- */
function vProyectos(pg){
  const all=proyectos();
  const comunas=[...new Set(all.map(p=>p.comuna).filter(Boolean))].sort();
  const resps=[...new Set(all.map(p=>p.responsable).filter(Boolean))].sort();
  let ps=all.filter(p=>{
    const f=S.filtro;
    if(f.comuna && p.comuna!==f.comuna) return false;
    if(f.resp && p.responsable!==f.resp) return false;
    if(f.edec && p.estado!==f.edec) return false;
    if(f.grupo && p.grupo!==f.grupo) return false;
    if(f.estado){
      const a=avEtapas(p,pg);
      if(f.estado==="completo" && a<1) return false;
      if(f.estado==="proceso" && !(a>0&&a<1)) return false;
      if(f.estado==="sin" && a>0) return false;
      if(f.estado==="critico" && a>=.34) return false;
    }
    if(f.q){ const q=f.q.toLowerCase();
      if(!((p.postulante||"")+" "+(p.rol||"")+" "+(p.codigo||"")+" "+(p.rut||"")+" "+(p.comuna||"")+" "+(p.localidad||"")+" "+(p.contratista||"")+" "+(p.grupo||"")+" "+(p.numero||"")).toLowerCase().includes(q)) return false; }
    return true;
  });
  const k=S.sort.k, dir=S.sort.dir;
  ps.sort((a,b)=>{
    let x,y;
    if(k==="avance"){x=avEtapas(a,pg);y=avEtapas(b,pg);}
    else if(k==="docs"){x=avDocs(a,pg);y=avDocs(b,pg);}
    else if(k==="numero"){x=a.numero||0;y=b.numero||0;}
    else {x=String(a[k]||"").toLowerCase();y=String(b[k]||"").toLowerCase();}
    return x<y?-dir : x>y?dir : 0;
  });
  const th=(key,lab,extra)=>`<th class="sortable" onclick="ordenar('${key}')"${extra||""}>${lab}${S.sort.k===key?(dir>0?" ↑":" ↓"):""}</th>`;
  const edecs=[...new Set(all.map(p=>p.estado).filter(Boolean))].sort();
  const grupos=[...new Set(all.map(p=>p.grupo).filter(Boolean))].sort();
  return `
  <div class="toolbar noprint">
    <input type="search" id="fq" placeholder="Buscar postulante, código, comuna…" value="${esc(S.filtro.q)}" oninput="setFiltro('q',this.value)">
    <select onchange="setFiltro('comuna',this.value)"><option value="">Todas las comunas</option>${comunas.map(c=>`<option${c===S.filtro.comuna?" selected":""}>${esc(c)}</option>`).join("")}</select>
    <select onchange="setFiltro('resp',this.value)"><option value="">Todos los responsables</option>${resps.map(c=>`<option${c===S.filtro.resp?" selected":""}>${esc(c)}</option>`).join("")}</select>
    ${grupos.length?`<select onchange="setFiltro('grupo',this.value)"><option value="">Todos los grupos</option>${grupos.map(c=>`<option${c===S.filtro.grupo?" selected":""}>${esc(c)}</option>`).join("")}</select>`:""}
    ${edecs.length?`<select onchange="setFiltro('edec',this.value)"><option value="">Todo estado declarado</option>${edecs.map(c=>`<option${c===S.filtro.edec?" selected":""}>${esc(c)}</option>`).join("")}</select>`:""}
    <select onchange="setFiltro('estado',this.value)">
      <option value="">Cualquier estado</option>
      <option value="critico"${S.filtro.estado==="critico"?" selected":""}>Requiere atención (&lt;34%)</option>
      <option value="sin"${S.filtro.estado==="sin"?" selected":""}>Sin iniciar</option>
      <option value="proceso"${S.filtro.estado==="proceso"?" selected":""}>En proceso</option>
      <option value="completo"${S.filtro.estado==="completo"?" selected":""}>Completos</option>
    </select>
    <div style="flex:1"></div>

  </div>
  <div class="panel">
    <header><h3>${ps.length} de ${all.length} proyectos</h3><span class="hint">Haz clic en un postulante para abrir su ficha</span></header>
    <div class="scroll"><table>
      <thead><tr>${th("numero","N°")}${th("codigo","Código")}${th("postulante","Postulante")}${th("comuna","Comuna")}${th("grupo","Grupo")}${th("estado","Estado declarado")}${th("avance","Avance de etapas")}${th("docs","Docs")}${th("responsable","Responsable")}<th>Últ. actualización</th></tr></thead>
      <tbody>${ps.map(p=>{
        const a=avEtapas(p,pg), et=(pg.etapas||[]);
        const done=et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)==="completa").length;
        const nna=et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)==="na").length;
        return `<tr><td class="mono" style="color:var(--ink-3)">${p.numero||"—"}</td>
          <td class="mono" style="font-size:12px;color:var(--ink-2)">${esc(p.codigo||"—")}</td>
          <td><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button>${p.localidad?`<div style="font-size:11px;color:var(--ink-3)">${esc(p.localidad)}</div>`:""}</td>
          <td>${esc(p.comuna||"—")}</td>
          <td>${p.grupo?`<span class="tag">${esc(p.grupo)}</span>`:'<span style="color:var(--ink-3)">—</span>'}</td>
          <td>${chipEstado(p.estado)}${p.motivo?`<div style="font-size:11px;color:var(--ink-3);margin-top:2px">${esc(p.motivo)}</div>`:""}</td>
          <td>${barra(a)}<div style="font-size:11px;color:var(--ink-3);margin-top:1px">${done}/${et.length-nna} etapas completas${nna?` · <span style="color:var(--crit)">${nna} n/c</span>`:""}</div></td>
          <td>${barra(avDocs(p,pg))}</td>
          <td style="color:var(--ink-2)">${p.responsable? esc(p.responsable) : '<span style="color:var(--crit);font-size:12px">sin asignar</span>'}</td>
          <td style="font-size:11.5px;color:var(--ink-3)">${p.updatedAt? new Date(p.updatedAt).toLocaleDateString("es-CL")+(p.updatedBy?" · "+esc(p.updatedBy):"") : "—"}</td></tr>`;
      }).join("") || '<tr><td colspan="10" class="empty">Ningún proyecto coincide con los filtros.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function setFiltro(k,v){ S.filtro[k]=v; render(); if(k==="q"){const i=$("#fq"); if(i){i.focus();i.setSelectionRange(v.length,v.length);}} }
function ordenar(k){ if(S.sort.k===k) S.sort.dir*=-1; else {S.sort.k=k;S.sort.dir=1;} render(); }
</script>
<script>
/* ---------------- MATRIZ DE ETAPAS ---------------- */
function vEtapas(pg){
  const ps=proyectos(), et=pg.etapas||[];
  if(!ps.length) return '<div class="panel"><div class="empty">Aún no hay proyectos en este programa.</div></div>';
  return `
  <div class="banner noprint"><span>↹</span><span>Haz clic en cualquier casilla para avanzar el estado: <b>No realizada → Parcial → Completa → No corresponde</b>. Lo que queda en «no corresponde» sale del cálculo del porcentaje. Cada cambio se guarda de inmediato para todo el equipo.</span></div>
  <div class="panel">
    <header><h3>${ps.length} proyectos × ${et.length} etapas</h3><span class="spacer"></span>
      <div class="legend">
        <span><i style="background:var(--good)"></i>Completa</span>
        <span><i style="background:var(--warn)"></i>Parcial</span>
        <span><i style="background:var(--surface-3);border-color:var(--line-2)"></i>No realizada</span>
        <span><i style="background:color-mix(in srgb,var(--crit) 16%,transparent);border-color:var(--crit)"></i>No corresponde</span>
      </div></header>
    <div class="scroll"><table class="matrix">
      <thead><tr><th class="name">Proyecto</th>${et.map(e=>`<th class="rot"><span>${esc(e.nombre)}</span></th>`).join("")}<th style="min-width:74px">Avance</th></tr></thead>
      <tbody>${ps.map(p=>{
        const a=avEtapas(p,pg);
        return `<tr><td class="name"><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button>
            <div style="font-size:11px;color:var(--ink-3)">${p.grupo?esc(p.grupo)+" · ":""}${p.codigo?esc(p.codigo)+" · ":""}${esc(p.comuna||"")}</div></td>
          ${et.map(e=>{
            const ee=(p.etapas||{})[e.id]||{}, st=ee.estado||"no";
            return `<td><button class="cell st-${st}" title="${esc(p.postulante)} — ${esc(e.nombre)}: ${(EST[st]||EST.no).lab}${st==="na"&&ee.respaldo?" ("+esc(ee.respaldo)+")":""}" aria-label="${esc(e.nombre)}: ${(EST[st]||EST.no).lab}" onclick="ciclarEtapa('${esc(p.id)}','${esc(e.id)}')"><i></i></button></td>`;
          }).join("")}
          <td style="padding:4px 8px;min-width:74px">${barra(a)}</td></tr>`;
      }).join("")}</tbody>
      <tfoot><tr><td class="name" style="font-weight:600;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line-2)">Completas</td>
        ${et.map(e=>{const c=ps.filter(p=>(((p.etapas||{})[e.id]||{}).estado)==="completa").length;
          const na=ps.filter(p=>(((p.etapas||{})[e.id]||{}).estado)==="na").length;
          return `<td class="num" style="font-size:11px;color:var(--ink-2);padding:6px 2px;border-top:1px solid var(--line-2)">${c}${na?`<div style="font-size:10px;color:var(--crit)" title="no corresponde">${na} n/c</div>`:""}</td>`;}).join("")}
        <td style="border-top:1px solid var(--line-2)"></td></tr></tfoot>
    </table></div>
  </div>`;
}
function ciclarEtapa(pid,eid){ return;
  const p=S.proys.find(x=>x.id===pid); if(!p) return;
  const orden=["no","parcial","completa","na"];
  const cur=((p.etapas||{})[eid]||{}).estado||"no";
  const next=orden[(orden.indexOf(cur)+1)%4];
  const et=Object.assign({},p.etapas||{});
  et[eid]=Object.assign({},et[eid]||{},{estado:next, fecha: next==="no"? "" : (et[eid]&&et[eid].fecha)||todayISO(), responsable:(et[eid]&&et[eid].responsable)||S.autor||""});
  guardarProy(p,{etapas:et});
}

/* ---------------- CARPETA DOCUMENTAL ---------------- */
function vDocs(pg){
  const ps=proyectos(), bl=pg.bloques||[];
  if(!ps.length) return '<div class="panel"><div class="empty">Aún no hay proyectos en este programa.</div></div>';
  const faltan = bl.map(b=>({b,f:ps.filter(p=>{const v=(p.bloques||{})[b.id]||{}; return !v.cargado && !v.na;}).length, na:ps.filter(p=>((p.bloques||{})[b.id]||{}).na).length}));
  return `
  <div class="banner noprint"><span>↹</span><span>Cada clic recorre <b>Pendiente → Cargado → No corresponde</b>. Lo marcado como «no corresponde» sale del denominador, así que no baja el porcentaje.</span></div>
  <div class="panel" style="margin-bottom:14px">
    <header><h3>Bloques con más faltantes</h3><span class="hint">sobre ${ps.length} proyectos</span></header>
    <div class="scroll"><table><thead><tr><th>Bloque</th><th>Contenido esperado</th><th style="width:150px">Cargado</th><th style="width:70px">Faltan</th></tr></thead>
      <tbody>${faltan.slice().sort((a,b)=>b.f-a.f).map(x=>`<tr>
        <td style="font-weight:600">${esc(x.b.nombre)}</td>
        <td style="color:var(--ink-2);font-size:12.5px">${esc(x.b.descripcion||"—")}</td>
        <td>${barra((ps.length-x.na-x.f)/Math.max(1,ps.length-x.na))}${x.na?`<div style="font-size:10.5px;color:var(--crit)">${x.na} no corresponde${x.na>1?"n":""}</div>`:""}</td>
        <td class="num" style="font-weight:600;color:${x.f? "var(--crit)":"var(--good)"}">${x.f}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="panel">
    <header><h3>Control de carpetas</h3><span class="spacer"></span>
      <div class="legend"><span><i style="background:var(--accent)"></i>Cargado</span><span><i style="background:var(--surface-3);border-color:var(--line-2)"></i>Pendiente</span><span><i style="background:color-mix(in srgb,var(--crit) 16%,transparent);border-color:var(--crit)"></i>No corresponde</span></div></header>
    <div class="scroll"><table class="matrix">
      <thead><tr><th class="name">Proyecto</th>${bl.map(b=>`<th class="rot"><span>${esc(b.nombre)}</span></th>`).join("")}<th style="min-width:74px">Completitud</th></tr></thead>
      <tbody>${ps.map(p=>`<tr>
        <td class="name"><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button>
          <div style="font-size:11px;color:var(--ink-3)">${p.codigo?esc(p.codigo)+" · ":""}${esc(p.comuna||"")}</div></td>
        ${bl.map(b=>{const on=!!((p.bloques||{})[b.id]||{}).cargado;
          const bb=(p.bloques||{})[b.id]||{}; const lab= bb.na? "no corresponde" : (on?"cargado":"pendiente");
          return `<td><button class="cell ${bb.na?"st-na":(on?"st-si":"st-no")}" title="${esc(p.postulante)} — ${esc(b.nombre)}: ${lab}${bb.na&&bb.obs?" ("+esc(bb.obs)+")":""}" aria-label="${esc(b.nombre)}: ${lab}" onclick="toggleBloque('${esc(p.id)}','${esc(b.id)}')"><i></i></button></td>`;}).join("")}
        <td style="padding:4px 8px">${barra(avDocs(p,pg))}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}
function toggleBloque(pid,bid){ return;
  const p=S.proys.find(x=>x.id===pid); if(!p) return;
  const bl=Object.assign({},p.bloques||{});
  const c=bl[bid]||{};
  let sig;
  if(c.na) sig={cargado:false,na:false,fecha:""};
  else if(c.cargado) sig={cargado:false,na:true,fecha:todayISO()};
  else sig={cargado:true,na:false,fecha:todayISO()};
  bl[bid]=Object.assign({},c,sig);
  guardarProy(p,{bloques:bl});
}
</script>
<script>
/* ---------------- REPORTES ---------------- */
function vReportes(pg){
  const ps=proyectos(), n=ps.length, et=pg.etapas||[], bl=pg.bloques||[];
  const avg = n? ps.reduce((s,p)=>s+avEtapas(p,pg),0)/n : 0;
  const avgD = n? ps.reduce((s,p)=>s+avDocs(p,pg),0)/n : 0;
  const d=diasPlazo(pg);
  const g=agrupaComunas(ps,pg);
  const hoy=new Date().toLocaleDateString("es-CL",{day:"2-digit",month:"long",year:"numeric"});

  const filasEtapa = et.map(e=>{
    const c={completa:0,parcial:0,no:0}; ps.forEach(p=>{c[((p.etapas||{})[e.id]||{}).estado||"no"]++;});
    return {e,c,av:n?(c.completa+c.parcial*.5)/n:0};
  }).sort((a,b)=>a.av-b.av);

  const filasComuna = Object.keys(g).sort().map(k=>{
    const l=g[k];
    return {com:k,n:l.length,
      av:l.reduce((s,p)=>s+avEtapas(p,pg),0)/l.length,
      doc:l.reduce((s,p)=>s+avDocs(p,pg),0)/l.length,
      comp:l.filter(p=>avEtapas(p,pg)>=1).length,
      cri:l.filter(p=>avEtapas(p,pg)<.34).length};
  }).sort((a,b)=>b.av-a.av);

  return `
  <div class="toolbar noprint">
    <button class="btn pri" onclick="window.print()">Imprimir / guardar PDF</button>
    <button class="btn" onclick="copiarResumen()">Copiar resumen ejecutivo</button>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <div class="pad" style="border-bottom:1px solid var(--line)">
      <div class="eyebrow">Informe de avance · ${esc(pg.codigo||"")}</div>
      <h3 style="font-size:21px;margin:5px 0 3px">${esc(pg.nombre)}</h3>
      <div style="color:var(--ink-3);font-size:12.5px">Emitido el ${hoy} · ${n} proyectos · ${Object.keys(g).length} comunas${pg.plazo?" · plazo comprometido "+fmtDate(pg.plazo):""}</div>
    </div>
    <div class="pad">
      <p style="margin:0 0 10px;max-width:68ch;font-size:14.5px;line-height:1.62">
        El conjunto registra un <b>${pct(avg)}% de avance en etapas</b> y un <b>${pct(avgD)}% de completitud documental</b>.
        ${ps.filter(p=>avEtapas(p,pg)>=1).length} de ${n} proyectos están cerrados,
        ${ps.filter(p=>avEtapas(p,pg)>0&&avEtapas(p,pg)<1).length} están en desarrollo y
        ${ps.filter(p=>avEtapas(p,pg)===0).length} no han iniciado ninguna etapa.
        ${d===null?"El plazo comprometido aún no está definido.":(d<0?"<b style='color:var(--crit)'>El plazo comprometido está vencido hace "+Math.abs(d)+" días.</b>":"Quedan <b>"+d+" días</b> para el plazo comprometido.")}
        ${filasEtapa.length?"La etapa más rezagada es <b>"+esc(filasEtapa[0].e.nombre)+"</b> ("+pct(filasEtapa[0].av)+"%).":""}
      </p>
      <div class="stats" style="border-radius:6px">
        <div class="stat"><div class="k">Avance etapas</div><div class="v">${pct(avg)}<small>%</small></div></div>
        <div class="stat"><div class="k">Completitud documental</div><div class="v">${pct(avgD)}<small>%</small></div></div>
        <div class="stat"><div class="k">Proyectos cerrados</div><div class="v">${ps.filter(p=>avEtapas(p,pg)>=1).length}<small>/${n}</small></div></div>
        <div class="stat"><div class="k">Bajo 34%</div><div class="v" style="color:var(--crit)">${ps.filter(p=>avEtapas(p,pg)<.34).length}</div></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>1 · Avance global por etapa</h3><span class="hint">Completa = 100%, Parcial = 50%, No realizada = 0%</span></header>
    <div class="chartwrap"><div id="rpEtapas"></div></div>
    <div class="scroll"><table>
      <thead><tr><th>Etapa</th><th style="width:110px">Completas</th><th style="width:100px">Parciales</th><th style="width:110px">No realizadas</th><th style="width:150px">Avance</th></tr></thead>
      <tbody>${filasEtapa.map(f=>`<tr>
        <td style="font-weight:600">${esc(f.e.nombre)}</td>
        <td><span class="tag"><i class="dot" style="background:var(--good)"></i>${f.c.completa}</span></td>
        <td><span class="tag"><i class="dot" style="background:var(--warn)"></i>${f.c.parcial}</span></td>
        <td><span class="tag"><i class="dot" style="background:var(--line-2)"></i>${f.c.no}</span></td>
        <td>${barra(f.av)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td style="font-weight:700;border-top:1px solid var(--line-2)">Total conjunto</td>
        <td colspan="3" style="border-top:1px solid var(--line-2)"></td>
        <td style="border-top:1px solid var(--line-2)">${barra(avg)}</td></tr></tfoot>
    </table></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>2 · Avance por comuna</h3></header>
    <div class="scroll"><table>
      <thead><tr><th>Comuna</th><th style="width:80px">Proyectos</th><th style="width:160px">Etapas</th><th style="width:160px">Documentos</th><th style="width:90px">Cerrados</th><th style="width:110px">Bajo 34%</th></tr></thead>
      <tbody>${filasComuna.map(f=>`<tr>
        <td style="font-weight:600">${esc(f.com)}</td><td class="num">${f.n}</td>
        <td>${barra(f.av)}</td><td>${barra(f.doc)}</td>
        <td class="num">${f.comp}</td>
        <td class="num" style="color:${f.cri?"var(--crit)":"var(--ink-3)"};font-weight:${f.cri?600:400}">${f.cri}</td></tr>`).join("")}</tbody>
    </table></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>3 · Checklist documental por beneficiario</h3><span class="hint">${bl.length} bloques exigidos por proyecto</span></header>
    <div class="scroll"><table>
      <thead><tr><th style="min-width:210px">Postulante</th><th>Comuna</th><th>Código</th><th style="width:130px">Completitud</th><th>Bloques faltantes</th></tr></thead>
      <tbody>${ps.map(p=>{
        const falta=bl.filter(b=>!((p.bloques||{})[b.id]||{}).cargado);
        return `<tr><td><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button></td>
          <td>${esc(p.comuna||"—")}</td><td class="mono" style="font-size:12px">${esc(p.codigo||p.rol||"—")}</td>
          <td>${barra(avDocs(p,pg))}</td>
          <td style="font-size:12px;color:var(--ink-2)">${falta.length? falta.map(b=>'<span class="tag" style="margin:1px 2px 1px 0">'+esc(b.nombre)+'</span>').join("") : '<span class="tag" style="background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)"><i class="dot" style="background:var(--good)"></i>Carpeta completa</span>'}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>4 · Alertas y plazos</h3></header>
    <div class="scroll"><table>
      <thead><tr><th style="min-width:200px">Postulante</th><th>Comuna</th><th style="width:130px">Avance</th><th>Estado declarado</th><th>Responsable</th><th>Etapas pendientes</th><th style="width:120px">Riesgo</th></tr></thead>
      <tbody>${ps.slice().sort((a,b)=>avEtapas(a,pg)-avEtapas(b,pg)).map(p=>{
        const a=avEtapas(p,pg);
        const pend=et.filter(e=>(((p.etapas||{})[e.id]||{}).estado||"no")!=="completa").length;
        const r = a>=1?["ok","Cerrado","var(--good)"] : (d!==null&&d<45&&a<.5)?["cr","Crítico","var(--crit)"] : a<.34?["cr","Crítico","var(--crit)"] : a<.7?["wa","Atención","var(--warn)"]:["ok","En curso","var(--s3)"];
        return `<tr><td><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button></td>
          <td>${esc(p.comuna||"—")}</td><td>${barra(a)}</td>
          <td>${chipEstado(p.estado)}</td>
          <td style="color:var(--ink-2)">${esc(p.responsable||"sin asignar")}</td>
          <td class="num">${pend} de ${et.length}</td>
          <td><span class="tag"><i class="dot" style="background:${r[2]}"></i>${r[1]}</span></td></tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>

  ${(()=>{ const ev=evalDe(pg);
    const nb=ev.bloques.filter(b=>b.cargado).length, ne=ev.etapas.filter(e=>e.estado==="completa").length;
    return `<div class="panel" style="margin-top:14px">
      <header><h3>5 · Evaluación previa del encargo</h3><span class="hint">formato de traspaso · ${nb}/10 antecedentes · ${ne}/12 etapas completas</span>
        <span class="spacer"></span></header>
      <div class="two" style="gap:0">
        <div class="scroll" style="border-right:1px solid var(--line)"><table>
          <thead><tr><th>Antecedente</th><th style="width:120px">Estado</th></tr></thead>
          <tbody>${ev.bloques.map(b=>`<tr><td style="font-size:12.5px">${esc(b.nombre)}${b.obs?`<div style="font-size:11px;color:var(--ink-3)">${esc(b.obs)}</div>`:""}</td>
            <td><span class="tag"><i class="dot" style="background:${b.cargado?"var(--good)":"var(--line-2)"}"></i>${b.cargado?"Cargado":"Pendiente"}</span></td></tr>`).join("")}</tbody>
        </table></div>
        <div class="scroll"><table>
          <thead><tr><th>Etapa desarrollada</th><th style="width:120px">Estado</th><th style="width:100px">Fecha</th></tr></thead>
          <tbody>${ev.etapas.map(e=>`<tr><td style="font-size:12.5px">${esc(e.nombre)}${e.responsable?`<div style="font-size:11px;color:var(--ink-3)">${esc(e.responsable)}</div>`:""}</td>
            <td><span class="tag"><i class="dot" style="background:${e.estado==="completa"?"var(--good)":(e.estado==="parcial"?"var(--warn)":"var(--line-2)")}"></i>${(EST[e.estado]||EST.no).lab}</span></td>
            <td style="font-size:12px;color:var(--ink-2)">${e.fecha?fmtDate(e.fecha):"—"}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>
    </div>`; })()}`;
}
function dibujarGraficosReporte(pg){
  const ps=proyectos(), n=ps.length;
  const filas=(pg.etapas||[]).map(e=>{
    const c={completa:0,parcial:0,no:0}; ps.forEach(p=>{c[((p.etapas||{})[e.id]||{}).estado||"no"]++;});
    return {nombre:e.nombre,c,av:n?(c.completa+c.parcial*.5)/n:0};
  }).sort((a,b)=>a.av-b.av);
  const el=$("#rpEtapas"); if(el) el.innerHTML=barrasApiladas(filas,n);
}
function copiarResumen(){
  const pg=prog(), ps=proyectos(), n=ps.length;
  const avg=n?ps.reduce((s,p)=>s+avEtapas(p,pg),0)/n:0, avgD=n?ps.reduce((s,p)=>s+avDocs(p,pg),0)/n:0;
  const d=diasPlazo(pg);
  const t=[pg.nombre,
    "Corte al "+new Date().toLocaleDateString("es-CL"),
    "Avance de etapas: "+pct(avg)+"%  |  Completitud documental: "+pct(avgD)+"%",
    "Proyectos: "+n+" ("+ps.filter(p=>avEtapas(p,pg)>=1).length+" cerrados, "+ps.filter(p=>avEtapas(p,pg)<.34).length+" bajo 34%)",
    d===null? "Plazo sin definir" : (d<0? "Plazo vencido hace "+Math.abs(d)+" días" : "Quedan "+d+" días para el plazo comprometido")].join("\n");
  navigator.clipboard.writeText(t).then(()=>{const el=$("#syncState");el.textContent="Resumen copiado al portapapeles";setTimeout(estadoSync,3000);},
    ()=>aviso("El navegador no permitió copiar."));
}

/* ---------------- EXPORTACIÓN ---------------- */
function csvCell(v){ v=String(v==null?"":v); return /[",;\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
async function bajarCSV(nombre,filas){
  const txt="\uFEFF"+filas.map(f=>f.map(csvCell).join(";")).join("\r\n");
  if(!S.dl){ aviso("La descarga de archivos no está disponible en esta vista."); return; }
  try{ await S.dl.save({filename:nombre, data:txt});
       const el=$("#syncState"); el.textContent="Archivo "+nombre+" guardado"; setTimeout(estadoSync,3500); }
  catch(e){
    if(e && e.code==="declined") return;
    aviso(e && e.code==="too_large" ? "El archivo supera el tamaño permitido." : "No se pudo guardar el archivo.");
  }
}
function exportarCSV(){
  const pg=prog(), ps=proyectos(), et=pg.etapas||[], bl=pg.bloques||[];
  const head=["N°","Código","Grupo","Comuna","Localidad","Postulante","RUT","Rol","Contratista","Estado declarado","Motivo","Responsable","Avance etapas %","Completitud docs %"]
    .concat(et.map(e=>"E: "+e.nombre)).concat(bl.map(b=>"D: "+b.nombre)).concat(["Observaciones","Última actualización"]);
  const rows=ps.map(p=>[p.numero,p.codigo,p.grupo,p.comuna,p.localidad,p.postulante,p.rut,p.rol,p.contratista,p.estado,p.motivo,p.responsable,pct(avEtapas(p,pg)),pct(avDocs(p,pg))]
    .concat(et.map(e=>EST[((p.etapas||{})[e.id]||{}).estado||"no"].lab))
    .concat(bl.map(b=>((p.bloques||{})[b.id]||{}).cargado?"Cargado":"Pendiente"))
    .concat([p.obs||"", p.updatedAt? new Date(p.updatedAt).toLocaleString("es-CL"):""]));
  bajarCSV("avance_"+(pg.codigo||"programa")+"_"+todayISO()+".csv",[head].concat(rows));
}
function exportarCSVEtapas(){
  const pg=prog(), ps=proyectos(), et=pg.etapas||[];
  const rows=[["N°","Código","Comuna","Postulante","Estado declarado","Etapa","Estado","Fecha","Responsable","Respaldo / nota original"]];
  ps.forEach(p=> et.forEach(e=>{ const v=(p.etapas||{})[e.id]||{};
    rows.push([p.numero,p.codigo,p.comuna,p.postulante,p.estado,e.nombre,EST[v.estado||"no"].lab,v.fecha||"",v.responsable||"",v.respaldo||""]); }));
  bajarCSV("etapas_detalle_"+(pg.codigo||"programa")+"_"+todayISO()+".csv",rows);
}
</script>
<script>
/* ---------------- FICHA (drawer) ---------------- */
function abrir(id){ S.openId=id; pintarDrawer(); }
function cerrar(){ S.openId=null; $("#drawer").classList.remove("on"); $("#drawer").setAttribute("aria-hidden","true"); $("#scrim").classList.remove("on"); }
function pintarDrawer(){
  const p=S.proys.find(x=>x.id===S.openId), pg=prog();
  const d=$("#drawer");
  if(!p||!pg){ cerrar(); return; }
  const et=pg.etapas||[], bl=pg.bloques||[];
  d.innerHTML=`
   <header>
     <div style="flex:1;min-width:0">
       <div class="eyebrow">${p.numero?"Proyecto N° "+p.numero+" · ":""}${esc(pg.codigo||pg.nombre)}</div>
       <h3>${esc(p.postulante)}</h3>

     <div class="panel"><header><h3>Identificación</h3></header>
       <div class="pad grid" style="grid-template-columns:repeat(auto-fit,minmax(148px,1fr))">

         <div class="fld" style="grid-column:span 2"><label>Postulante</label><input value="${esc(p.postulante||"")}" onchange="campo('${esc(p.id)}','postulante',this.value)"></div>

         <div class="fld"><label>Estado declarado</label><input value="${esc(p.estado||"")}" placeholder="Ej. Falta cierre 100%" onchange="campo('${esc(p.id)}','estado',this.value)"></div>

         <div class="fld"><label>Responsable</label><input value="${esc(p.responsable||"")}" placeholder="Nombre del profesional" onchange="campo('${esc(p.id)}','responsable',this.value)"></div>

       </div>
     </div>

     <div class="panel"><header><h3>Etapas del proyecto</h3><span class="hint">${et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)==="completa").length} de ${et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)!=="na").length} completas${et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)==="na").length?" · "+et.filter(e=>(((p.etapas||{})[e.id]||{}).estado)==="na").length+" no corresponden":""}</span></header>
       <div class="pad stagelist">${et.map(e=>{
         const v=(p.etapas||{})[e.id]||{}, st=v.estado||"no";
         return `<div class="stagerowe">
           <div><div class="nm">${esc(e.nombre)}</div>
             <div class="sub">

               <label style="display:inline-flex;gap:5px;align-items:center">Respaldo <input value="${esc(v.respaldo||"")}" placeholder="carpeta / archivo" style="border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--surface-2);font-size:11.5px;width:150px" onchange="etapaCampo('${esc(p.id)}','${esc(e.id)}','respaldo',this.value)"></label>
             </div></div>
           <div class="seg">${["no","parcial","completa","na"].map(k=>
             `<button class="${st===k?"on "+k:""}" title="${k==="na"?"El documento no aplica a este beneficiario: sale del cálculo del porcentaje":""}" onclick="etapaCampo('${esc(p.id)}','${esc(e.id)}','estado','${k}')">${k==="na"?"No corresponde":EST[k].lab}</button>`).join("")}</div>
         </div>`;
       }).join("")}</div>
