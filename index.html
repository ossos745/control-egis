     <div class="panel"><header><h3>Antecedentes cargados</h3><span class="hint">${bl.filter(b=>((p.bloques||{})[b.id]||{}).cargado).length} de ${bl.filter(b=>!((p.bloques||{})[b.id]||{}).na).length}${bl.filter(b=>((p.bloques||{})[b.id]||{}).na).length?" · "+bl.filter(b=>((p.bloques||{})[b.id]||{}).na).length+" no corresponden":""}</span></header>
       <div class="pad"><div class="docgrid">${bl.map(b=>{
         const v=(p.bloques||{})[b.id]||{}, on=!!v.cargado, na=!!v.na;
         return `<label class="doc ${na?"na":(on?"on":"")}" title="Un clic recorre pendiente → cargado → no corresponde"><input type="checkbox" ${on?"checked":""} ${na?"disabled":""} onchange="toggleBloque('${esc(p.id)}','${esc(b.id)}');pintarDrawer()">
           ${na?`<button type="button" style="all:unset;cursor:pointer;color:var(--crit);font-weight:700;flex:none;line-height:1" title="Volver a pendiente" onclick="event.preventDefault();toggleBloque('${esc(p.id)}','${esc(b.id)}');pintarDrawer()">✕</button>`:""}
           <span><span class="t">${esc(b.nombre)}${na?'<span class="na-tag">no corresponde</span>':""}</span><span class="d">${esc(na&&v.obs?v.obs:(b.descripcion||""))}</span></span></label>`;
       }).join("")}</div></div>
     </div>

     <div style="display:flex;gap:8px;padding-bottom:20px">
       <div style="flex:1;font-size:11.5px;color:var(--ink-3);align-self:center">${p.updatedAt? "Última actualización "+new Date(p.updatedAt).toLocaleString("es-CL")+(p.updatedBy?" por "+esc(p.updatedBy):"") : "Sin actualizaciones registradas"}</div>

     </div>
   </div>`;
  d.classList.add("on"); d.setAttribute("aria-hidden","false"); $("#scrim").classList.add("on");
}
function campo(pid,k,v){ return; const p=S.proys.find(x=>x.id===pid); if(!p) return;
  guardarProy(p,{[k]: k==="numero"? (parseInt(v,10)||null) : v}); pintarDrawer(); }
function etapaCampo(pid,eid,k,v){ return;
  const p=S.proys.find(x=>x.id===pid); if(!p) return;
  const et=Object.assign({},p.etapas||{});
  const cur=Object.assign({},et[eid]||{});
  cur[k]=v;
  if(k==="estado"){ if(v==="no") cur.fecha=""; else if(!cur.fecha) cur.fecha=todayISO();
    if(!cur.responsable) cur.responsable=S.autor||p.responsable||""; }
  et[eid]=cur;
  guardarProy(p,{etapas:et}); pintarDrawer();
}
async function eliminarProyecto(pid){ return;
  const p=S.proys.find(x=>x.id===pid); if(!p) return;
  if(!confirm("¿Eliminar definitivamente el proyecto de "+p.postulante+"? Esta acción no se puede deshacer.")) return;
  S.proys=S.proys.filter(x=>x.id!==pid); cerrar(); render();
  if(S.db){ try{ await S.db.doc("proyectos/"+pid).delete(); }catch(e){ aviso("No se pudo eliminar en la base de datos."); } }
}
</script>
<script>
/* ---------------- CONFIGURACIÓN ---------------- */
function vConfig(pg){ return '<div class="panel"><div class="empty">Esta es la vista pública de solo lectura.</div></div>'; }
function pgCampo(k,v){ return; guardarProg(prog(),{[k]:v}); }
function setAutor(v){ S.autor=v; try{localStorage.setItem("egis.autor",v);}catch(e){} render(); }
function uid(pref){ return pref+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function agregarEtapa(){ const pg=prog(); const n=prompt("Nombre de la nueva etapa:"); if(!n) return;
  guardarProg(pg,{etapas:(pg.etapas||[]).concat([{id:uid("e"),nombre:n}])}); }
function renombrarEtapa(id,n){ const pg=prog(); guardarProg(pg,{etapas:(pg.etapas||[]).map(e=>e.id===id?Object.assign({},e,{nombre:n}):e)}); }
function moverEtapa(i,d){ const pg=prog(); const a=(pg.etapas||[]).slice(); const j=i+d;
  if(j<0||j>=a.length) return; const t=a[i]; a[i]=a[j]; a[j]=t; guardarProg(pg,{etapas:a}); }
function borrarEtapa(id){ const pg=prog(); if(!confirm("¿Eliminar esta etapa? Se perderán los estados registrados en ella.")) return;
  guardarProg(pg,{etapas:(pg.etapas||[]).filter(e=>e.id!==id)}); }
function agregarBloque(){ const pg=prog(); const n=prompt("Nombre del bloque documental:"); if(!n) return;
  guardarProg(pg,{bloques:(pg.bloques||[]).concat([{id:uid("b"),nombre:n,descripcion:""}])}); }
function editarBloque(id,k,v){ const pg=prog(); guardarProg(pg,{bloques:(pg.bloques||[]).map(b=>b.id===id?Object.assign({},b,{[k]:v}):b)}); }
function borrarBloque(id){ const pg=prog(); if(!confirm("¿Eliminar este bloque documental?")) return;
  guardarProg(pg,{bloques:(pg.bloques||[]).filter(b=>b.id!==id)}); }

async function nuevoPrograma(){
  const n=prompt("Nombre del nuevo programa o encargo:","DS10 · Habitabilidad Rural"); if(!n) return;
  const base=prog();
  const p={id:uid("pg"),nombre:n,codigo:"",plazo:"",tipologia:"",coordinador:"",contacto:"",drive:"",
    etapas:(base&&base.etapas||[]).map(e=>({id:uid("e"),nombre:e.nombre})),
    bloques:(base&&base.bloques||[]).map(b=>({id:uid("b"),nombre:b.nombre,descripcion:b.descripcion||""}))};
  S.progs.push(p); S.progId=p.id; S.view="config"; syncNav(); render();
  if(S.db){ try{ await S.db.doc("programas/"+p.id).set(JSON.parse(JSON.stringify(p))); }catch(e){ aviso("No se pudo crear el programa."); } }
}
async function eliminarPrograma(id){
  const p=S.progs.find(x=>x.id===id); if(!p) return;
  const n=S.proys.filter(x=>x.programaId===id).length;
  if(!confirm("¿Eliminar «"+p.nombre+"»"+(n?" y sus "+n+" proyectos":"")+"? No se puede deshacer.")) return;
  const borrar=S.proys.filter(x=>x.programaId===id).map(x=>x.id);
  S.progs=S.progs.filter(x=>x.id!==id); S.proys=S.proys.filter(x=>x.programaId!==id);
  if(S.progId===id) S.progId=(S.progs[0]||{}).id;
  render();
  if(S.db){ try{ await S.db.doc("programas/"+id).delete(); for(const b of borrar) await S.db.doc("proyectos/"+b).delete(); }catch(e){ aviso("No se pudo eliminar todo en la base de datos."); } }
}
async function crearProyecto(datos){
  const pg=prog(); if(!pg) return null;
  const p=Object.assign({id:uid("p"),programaId:pg.id,numero:null,comuna:"",postulante:"",rol:"",codigo:"",rut:"",localidad:"",contratista:"",grupo:"",estado:"",motivo:"",responsable:"",obs:"",etapas:{},bloques:{},
    updatedAt:new Date().toISOString(),updatedBy:S.autor||"—"},datos);
  S.proys.push(p);
  if(S.db){ try{ await S.db.doc("proyectos/"+p.id).set(JSON.parse(JSON.stringify(p))); }catch(e){ aviso("No se pudo guardar el proyecto nuevo."); } }
  return p;
}
async function nuevoProyecto(){
  const n=prompt("Nombre del postulante:"); if(!n) return;
  const max=Math.max(0,...proyectos().map(p=>p.numero||0));
  const p=await crearProyecto({postulante:n.trim(),numero:max+1});
  render(); if(p) abrir(p.id);
}
async function cargarMasivo(){
  const t=($("#bulk")||{}).value||"";
  const lineas=t.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!lineas.length){ aviso("No hay líneas que cargar."); return; }
  let n=0;
  for(const l of lineas){
    const c=l.split(/\t|;|,(?=\s*\S)/).map(s=>s.trim());
    if(c.length<2) continue;
    const num=parseInt(c[0],10);
    const off = isNaN(num)?0:1;
    await crearProyecto({numero:isNaN(num)?null:num, comuna:c[off]||"", postulante:c[off+1]||c[off]||"", rol:c[off+2]||""});
    n++;
  }
  render();
  const el=$("#syncState"); el.textContent=n+" proyectos agregados"; setTimeout(estadoSync,3500);
}
</script>
<script>
/* ============================================================
   AVANCE TÉCNICO · cartera propia
   El avance se lee de las carpetas del computador de la EGIS:
   ingreso en obra (22 documentos) y módulo de postulación (26 carpetas).
   ============================================================ */
const FASES=["Sin iniciar","Terreno resuelto","Ingresado en obra","Módulo abierto","En obra y en módulo","Módulo completo"];
const FASE_COLOR={"Sin iniciar":"var(--line-2)","Terreno resuelto":"var(--serious)","Ingresado en obra":"var(--warn)",
  "Módulo abierto":"var(--s4)","En obra y en módulo":"var(--s3)","Módulo completo":"var(--good)"};
function atDe(){ return proyectos().filter(p=>p.at && p.at.obra); }
function cuadro(st){
  if(st==="na") return '<i class="nabox" title="No corresponde"></i>';
  const col= st==="completa"?"var(--good)" : st==="parcial"?"var(--warn)" : "var(--surface-3)";
  const bd = st==="no"? "var(--line-2)" : "color-mix(in srgb,"+col+" 70%,#000)";
  return '<i style="display:block;width:13px;height:13px;border-radius:3px;background:'+col+';border:1px solid '+bd+'"></i>';
}
function tonoPct(v){ return v>=90?"var(--good)" : v>=60?"var(--s3)" : v>=30?"var(--warn)" : v>0?"var(--serious)":"var(--line-2)"; }
function chipFase(f){ return `<span class="tag"><i class="dot" style="background:${FASE_COLOR[f]||"var(--ink-3)"}"></i>${esc(f||"—")}</span>`; }
function miniBar(v,tot,color){
  const p=tot? Math.round(v/tot*100):0;
  return `<div class="bar"><div class="track"><div class="fill" style="width:${p}%;background:${color||tonoPct(p)}"></div></div><b style="width:46px">${v}/${tot}</b></div>`;
}
function vAvanceTecnico(pg){
  const ps=atDe();
  if(!ps.length) return '<div class="panel"><div class="empty">Esta cartera no tiene beneficiarios con avance técnico medido.</div></div>';
  const n=ps.length;
  const enObra=ps.filter(p=>p.at.obra.ingresado).length;
  const enMod=ps.filter(p=>p.at.modulo.ingresado).length;
  const pObra=Math.round(ps.reduce((s,p)=>s+p.at.obra.pct,0)/n);
  const pMod=Math.round(ps.reduce((s,p)=>s+p.at.modulo.pct,0)/n);
  const global=Math.round((pObra+pMod)/2);
  const conAbs=ps.filter(p=>p.at.absorcion).length;
  const ajenos=ps.reduce((s,p)=>s+(p.at.modulo.ajenos||0),0);
  const nocorr=ps.reduce((s,p)=>s+(p.at.modulo.na||0)+(p.at.obra.na||0),0);
  const listaNC=ps.flatMap(p=>(p.at.noCorresponden||[]).map(x=>({p:p.postulante,x})));
  const mb=ps.reduce((s,p)=>s+(p.at.modulo.mb||0),0);
  const arch=ps.reduce((s,p)=>s+(p.at.modulo.archivos||0),0);
  const dias=ps.map(p=>p.at.modulo.diasSinMovimiento).filter(v=>v!=null);
  const corte=(ps[0].at.actualizado||"").replace("T"," ");
  const orden=ps.slice().sort((a,b)=>(b.at.obra.pct+b.at.modulo.pct)-(a.at.obra.pct+a.at.modulo.pct));

  // embudo
  const cuenta={}; FASES.forEach(f=>cuenta[f]=0);
  ps.forEach(p=>{ cuenta[p.at.fase]=(cuenta[p.at.fase]||0)+1; });

  // frentes agregados
  const frentes={};
  ps.forEach(p=>(p.at.frentes||[]).forEach(f=>{
    frentes[f.nombre]=frentes[f.nombre]||{ok:0,tot:0};
    frentes[f.nombre].ok+=f.ok; frentes[f.nombre].tot+=f.tot; }));
  const frArr=Object.keys(frentes).map(k=>({lab:k,...frentes[k],pct:Math.round(frentes[k].ok/frentes[k].tot*100)}))
    .sort((a,b)=>b.pct-a.pct);

  // etapas del módulo agregadas (solo sobre los que tienen carpeta)
  const conMod=ps.filter(p=>p.at.modulo.ingresado);
  const etapas=(pg.etapas||[]).map(e=>{
    const c=conMod.filter(p=>((p.etapas||{})[e.id]||{}).estado==="completa").length;
    const pa=conMod.filter(p=>((p.etapas||{})[e.id]||{}).estado==="parcial").length;
    const nn=conMod.filter(p=>((p.etapas||{})[e.id]||{}).estado==="na").length;
    return {nombre:e.nombre,ok:c,par:pa,na:nn,tot:conMod.length||1};
  });
  const docs=(pg.bloques||[]).map(b=>{
    const c=ps.filter(p=>p.at.obra.ingresado && ((p.bloques||{})[b.id]||{}).cargado).length;
    return {nombre:b.nombre,ok:c,tot:ps.filter(p=>p.at.obra.ingresado).length||1};
  });

  const alertas=[];
  if(ajenos) alertas.push(["wa",ajenos,"Carpetas con documentos de otras personas",
    "En el módulo hay "+ajenos+" carpeta"+(ajenos>1?"s":"")+" con contenido, pero ninguno de los archivos está a nombre del beneficiario. Cuentan como carpeta ocupada, no como documento entregado."]);
  const sinNada=ps.filter(p=>p.at.fase==="Sin iniciar").length;
  if(sinNada) alertas.push(["cr",sinNada,"Sin ninguna carpeta abierta",
    sinNada+" beneficiario"+(sinNada>1?"s":"")+" no tiene carpeta de obra ni módulo de postulación, y tampoco informe de absorción."]);
  if(conAbs) alertas.push(["ok",conAbs,"Terreno resuelto, esperando apertura",
    conAbs+" beneficiario"+(conAbs>1?"s":"")+" ya tiene informe de absorción pero todavía no se le abre carpeta de obra."]);
  if(nocorr) alertas.push(["ok",nocorr,"Carpetas marcadas «no corresponde»",
    listaNC.length? listaNC.map(o=>o.p.split(" ")[0]+": "+o.x).join(" · ")+". No se cuentan en el porcentaje."
                  : nocorr+" carpetas quedaron fuera del cálculo porque el documento no aplica a ese beneficiario."]);
  const detenido=ps.filter(p=>p.at.modulo.diasSinMovimiento!=null && p.at.modulo.diasSinMovimiento>60);
  if(detenido.length) alertas.push(["wa",detenido.length,"Expedientes sin movimiento",
    "Más de 60 días sin archivos nuevos: "+detenido.map(p=>p.postulante).join(", ")+"."]);

  const fichas=orden.filter(p=>p.at.obra.ingresado||p.at.modulo.ingresado).map(p=>{
    const a=p.at;
    return `<div class="panel" style="margin-bottom:14px">
      <header><h3>${esc(p.postulante)}</h3>
        <span class="hint">${esc(p.comuna||"")} · RUKAN ${esc(p.codigo||"—")} · rol ${esc(p.rol||"—")}</span>
        <span class="spacer"></span>${chipFase(a.fase)}</header>
      <div class="stats" style="border:0;border-bottom:1px solid var(--line);border-radius:0">
        <div class="stat"><div class="k">Ingreso en obra</div><div class="v">${a.obra.pct}<small>%</small></div>
          <div class="m">${a.obra.completos} de ${a.obra.base!=null?a.obra.base:a.obra.total} documentos${a.obra.na?" · "+a.obra.na+" fuera del cálculo":""}</div></div>
        <div class="stat"><div class="k">Módulo de postulación</div><div class="v">${a.modulo.pct}<small>%</small></div>
          <div class="m">${a.modulo.completos} de ${a.modulo.base!=null?a.modulo.base:a.modulo.total} carpetas${a.modulo.na?" · "+a.modulo.na+" no corresponde"+(a.modulo.na>1?"n":""):""}</div></div>
        <div class="stat"><div class="k">Volumen del expediente</div><div class="v">${a.modulo.archivos}<small> arch.</small></div>
          <div class="m">${a.modulo.mb} MB en carpeta</div></div>
        <div class="stat"><div class="k">Último movimiento</div><div class="v" style="font-size:19px">${esc(a.modulo.ultimoMovimiento||"—")}</div>
          <div class="m">${a.modulo.diasSinMovimiento!=null? "hace "+a.modulo.diasSinMovimiento+" días" : "sin registro"}</div></div>
      </div>
      <div class="two" style="gap:0">
        <div class="scroll" style="border-right:1px solid var(--line)">
          <table><thead><tr><th colspan="2">Documentos de ingreso en obra · ${a.obra.completos}/${a.obra.base!=null?a.obra.base:a.obra.total}${a.obra.na?" · "+a.obra.na+" no corresponde"+(a.obra.na>1?"n":""):""}</th></tr></thead>
          <tbody>${a.obra.ingresado? a.obra.docs.map(d=>`<tr>
            <td style="width:22px">${cuadro(d.na?"na":(d.ok?"completa":"no"))}</td>
            <td style="font-size:12.5px">${esc(d.nombre)}${d.na?'<span class="na-tag">no corresponde</span>':""}

        <td style="width:126px">${e.na?`<span class="tag" style="border-color:var(--crit);color:var(--crit)"><i class="dot" style="background:var(--crit)"></i>no corresponde</span>`:(e.ok?`<span class="tag"><i class="dot" style="background:var(--good)"></i>${e.ok}</span>`:(e.par?`<span class="tag"><i class="dot" style="background:var(--warn)"></i>ajeno</span>`:`<span class="tag"><i class="dot" style="background:var(--line-2)"></i>vacía</span>`))}</td>

        <td style="width:70px">${d.ok?`<span class="tag"><i class="dot" style="background:var(--good)"></i>${d.ok}</span>`:`<span class="tag"><i class="dot" style="background:var(--line-2)"></i>—</span>`}</td>

<script>
/* ============================================================
   FUENTES DE DATOS · qué archivo alimenta cada parte del sistema
   ============================================================ */
const USO={
  activa:{lab:"En uso",color:"var(--good)",bg:"var(--good-soft)"},
  pendiente:{lab:"Por incorporar",color:"var(--warn)",bg:"var(--warn-soft)"},
  descartada:{lab:"No se usa",color:"var(--ink-3)",bg:"var(--surface-2)"}
};
function chipUso(u){ const x=USO[u]||USO.descartada;
  return `<span class="tag" style="background:${x.bg};border-color:color-mix(in srgb,${x.color} 35%,transparent)"><i class="dot" style="background:${x.color}"></i>${x.lab}</span>`; }
function rutaCompleta(f){
  const r=(f.ruta||"").trim(), a=(f.archivo||"").trim();
  if(!r) return a;
  if(/^[A-Za-z]:\\/.test(r) && /\.(xls[xm]?|pdf|csv)$/i.test(a)) return r.replace(/\\+$/,"")+"\\"+a;
  return r;
}
function vFuentes(pg){
  const grupos=S.progs.map(x=>({pg:x,fuentes:(x.fuentes||[])})).filter(g=>g.fuentes.length);
  if(!grupos.length) return '<div class="panel"><div class="empty">Todavía no hay fuentes registradas.</div></div>';
  const todas=grupos.flatMap(g=>g.fuentes);
  const act=todas.filter(f=>f.uso==="activa").length;
  const desc=todas.filter(f=>f.uso==="descartada").length;
  const pend=todas.filter(f=>f.uso==="pendiente").length;
  const carpetas=[...new Set(todas.filter(f=>f.uso!=="descartada").map(f=>f.ruta).filter(r=>/^[A-Za-z]:\\/.test(r||"")))].sort();
  const ult=todas.map(f=>f.ultimaCarga).filter(Boolean).sort().pop();

  const bloque=g=>{
    const act=g.fuentes.filter(f=>f.uso!=="descartada");
    const no=g.fuentes.filter(f=>f.uso==="descartada");
    const fila=f=>`<tr>
      <td style="min-width:210px"><div style="font-weight:600;font-size:12.5px">${esc(f.parte)}</div>
        ${f.nota?`<div style="font-size:11.5px;color:var(--ink-3);line-height:1.45;max-width:56ch">${esc(f.nota)}</div>`:""}</td>
      <td style="min-width:230px"><div class="mono" style="font-size:11.5px;color:var(--ink)">${esc(f.archivo)}</div>
        ${f.hoja && f.hoja!=="—"?`<div style="font-size:11px;color:var(--ink-3)">Hoja: ${esc(f.hoja)}</div>`:""}</td>
      <td style="min-width:250px"><div class="mono" style="font-size:11px;color:var(--ink-2);word-break:break-all">${esc(rutaCompleta(f))}</div></td>
      <td style="width:120px">${chipUso(f.uso)}
        ${f.ultimaCarga?`<div style="font-size:11px;color:var(--ink-3);margin-top:3px">Importado ${esc(new Date(f.ultimaCarga).toLocaleDateString("es-CL"))}</div>`:""}</td>
    </tr>`;
    return `<div class="panel" style="margin-bottom:14px">
      <header><h3>${esc(g.pg.nombre)}</h3><span class="hint">${esc(g.pg.codigo||"")} · ${S.proys.filter(p=>p.programaId===g.pg.id).length} proyectos</span></header>
      <div class="scroll"><table>
        <thead><tr><th>Qué alimenta</th><th>Archivo</th><th>Ruta</th><th>Estado</th></tr></thead>
        <tbody>${act.map(fila).join("")}</tbody>
        ${no.length?`<tbody><tr><td colspan="4" style="background:var(--surface-2);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)">Archivos y hojas que el sistema NO está usando</td></tr>${no.map(fila).join("")}</tbody>`:""}
      </table></div>
    </div>`;
  };

  return `
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><div class="k">Fuentes en uso</div><div class="v">${act}</div>
      <div class="m">${grupos.length} carteras</div></div>
    <div class="stat"><div class="k">Descartadas</div><div class="v" style="color:var(--ink-3)">${desc}</div>
      <div class="m">duplicados y versiones antiguas</div></div>
    <div class="stat"><div class="k">Por incorporar</div><div class="v" style="color:${pend?"var(--warn)":"var(--ink-3)"}">${pend}</div>
      <div class="m">disponibles pero aún no leídas</div></div>
    <div class="stat"><div class="k">Última importación</div><div class="v" style="font-size:19px">${ult? esc(new Date(ult).toLocaleDateString("es-CL")) : "—"}</div>
      <div class="m">${ult? "desde el botón Importar planilla" : "todavía no se importa desde la página"}</div></div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>Carpetas de origen</h3><span class="hint">en el computador de la EGIS</span></header>
    <div class="pad" style="display:flex;flex-direction:column;gap:7px">
      ${carpetas.map(r=>`<div class="mono" style="font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;word-break:break-all">${esc(r)}</div>`).join("")}
      <p style="margin:4px 0 0;font-size:11.5px;color:var(--ink-3);max-width:70ch">Los datos no se leen solos desde estas carpetas: entran por el botón <b>Importar planilla</b> de la vista Proyectos, o por la sincronización diaria cuando esté aprobada en el computador.</p>
    </div>
  </div>

  ${grupos.map(bloque).join("")}`;
}
</script>

<script>
/* ============================================================
   CARTERA CRÍTICA · ficha de expediente
   Fuente: PHR_1_CSR_Cartera_Critica_2026.xlsm (Nomina_CC) + Cartera_Critica.xlsx
   ============================================================ */
const uf = v => (v==null||v==="") ? "—" : Number(v).toLocaleString("es-CL",{maximumFractionDigits:1});
const tramoRSH = v => { if(v==null||v==="") return "—"; const n=Number(String(v).replace(",",".")); return isNaN(n)? String(v) : (n<=1? Math.round(n*100)+"%" : n+"%"); };
function ccDe(){ return proyectos().filter(p=>p.cc && p.cc.expediente); }
function tonoEspera(a){ return a==null?"var(--ink-3)" : a>=9?"var(--crit)" : a>=7?"var(--serious)" : a>=5?"var(--warn)":"var(--s3)"; }
function tonoDeficit(d){ const s=(d||"").toLowerCase(); return s==="alta"?"var(--crit)" : s==="media"?"var(--warn)" : s==="baja"?"var(--s3)":"var(--ink-3)"; }
function critico(p){
  const c=p.cc||{}; let n=0;
  if((c.esperaAnios||0)>=9) n++;
  if((c.deficit||"").toLowerCase()==="alta") n++;
  if(/renunci|fallec|propiedad|repar|usufructo|problema/i.test(c.situacion||"")) n+=2;
  if((c.edad||0)>=75) n++;
  if(!c.rol || !c.inscripcion) n++;
  return n;
}
function vCartera(pg){
  const ps=ccDe();
  if(!ps.length) return '<div class="panel"><div class="empty">Este programa no tiene expedientes de cartera crítica cargados.<br><span style="font-size:12px">Importa <b>PHR_1_CSR_Cartera_Critica_2026.xlsm</b> o <b>Cartera_Critica.xlsx</b> desde el botón «Importar planilla».</span></div></div>';
  const n=ps.length;
  const totalUF=ps.reduce((s,p)=>s+(p.cc.subsidio||0),0);
  const esperas=ps.map(p=>p.cc.esperaAnios).filter(v=>v!=null);
  const espProm=esperas.length? esperas.reduce((a,b)=>a+b,0)/esperas.length : null;
  const altas=ps.filter(p=>(p.cc.deficit||"").toLowerCase()==="alta").length;
  const conObs=ps.filter(p=>p.cc.situacion).length;
  const mayores=ps.filter(p=>(p.cc.edad||0)>=70).length;

  // partidas agregadas
  const part={};
  ps.forEach(p=>(p.cc.partidas||[]).forEach(x=>{ part[x.nombre]=(part[x.nombre]||0)+(x.uf||0); }));
  const partArr=Object.keys(part).map(k=>({lab:k,uf:part[k]})).sort((a,b)=>b.uf-a.uf);
  const maxPart=Math.max(...partArr.map(x=>x.uf),1);

  const orden=ps.slice().sort((a,b)=>critico(b)-critico(a) || (b.cc.esperaAnios||0)-(a.cc.esperaAnios||0));
  const maxEsp=Math.max(...ps.map(p=>p.cc.esperaAnios||0),1);
  const propios=new Set(ps.map(p=>nrmTxt(p.postulante)));
  const regTodos=(pg.ccRegional||[]);
  const reg=regTodos.filter(r=>!propios.has(nrmTxt(r.nombre)));
  const regCruce=regTodos.length-reg.length;
  const porComuna={}; ps.forEach(p=>{ const k=p.cc.comuna||"Sin comuna"; (porComuna[k]=porComuna[k]||{n:0,uf:0}); porComuna[k].n++; porComuna[k].uf+=p.cc.subsidio||0; });

  return `
  <div class="stats" style="margin-bottom:14px">
    <div class="stat"><div class="k">Expedientes críticos</div><div class="v">${n}</div>
      <div class="m">${Object.keys(porComuna).length} comunas · EGR ${esc(ps[0].cc.egr||"—")}</div></div>
    <div class="stat"><div class="k">Subsidio comprometido</div><div class="v">${uf(Math.round(totalUF))}<small> UF</small></div>
      <div class="m">promedio ${uf(Math.round(totalUF/n))} UF por expediente</div></div>
    <div class="stat"><div class="k">Espera promedio</div><div class="v" style="color:${tonoEspera(espProm)}">${espProm==null?"—":espProm.toFixed(1)}<small> años</small></div>
      <div class="m">desde la selección o postulación</div></div>
    <div class="stat"><div class="k">Déficit alto</div><div class="v" style="color:${altas?"var(--crit)":"var(--ink)"}">${altas}<small>/${n}</small></div>
      <div class="m">${mayores} postulante${mayores===1?"":"s"} de 70 años o más</div></div>
    <div class="stat"><div class="k">Con situación observada</div><div class="v" style="color:${conObs?"var(--warn)":"var(--ink)"}">${conObs}</div>
      <div class="m">requieren gestión antes de continuar</div></div>
  </div>

  <div class="grid" style="grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start;margin-bottom:14px">
    <div class="panel">
      <header><h3>Antigüedad del expediente</h3><span class="hint">años desde la selección o postulación · rojo sobre 9 años</span></header>
      <div class="scroll"><table><tbody>${ps.slice().sort((a,b)=>(b.cc.esperaAnios||0)-(a.cc.esperaAnios||0)).map(p=>{
        const c=p.cc, a=c.esperaAnios;
        return `<tr>
          <td style="min-width:200px"><button class="rowbtn" onclick="abrir('${esc(p.id)}')">${esc(p.postulante)}</button>
            <div style="font-size:11px;color:var(--ink-3)">Exp. ${esc(c.expediente)} · ${esc(c.comuna)}${c.anio?" · sel. "+esc(c.anio):""}</div></td>
          <td style="width:190px"><div class="bar"><div class="track"><div class="fill" style="width:${Math.round((a||0)/maxEsp*100)}%;background:${tonoEspera(a)}"></div></div><b>${a==null?"—":a.toFixed(1)}</b></div></td>
          <td style="width:96px"><span class="tag"><i class="dot" style="background:${tonoDeficit(c.deficit)}"></i>${esc(c.deficit||"—")}</span></td>
        </tr>`; }).join("")}</tbody></table></div>
    </div>
    <div class="panel">
      <header><h3>Subsidio por partida</h3><span class="hint">UF sumadas de los ${n} expedientes</span></header>
      <div class="scroll"><table><tbody>${partArr.map(x=>`<tr>
        <td style="font-size:12.5px">${esc(x.lab)}</td>
        <td style="width:150px"><div class="bar"><div class="track"><div class="fill" style="width:${Math.round(x.uf/maxPart*100)}%;background:var(--s1)"></div></div><b style="width:52px">${uf(x.uf)}</b></div></td>
      </tr>`).join("")}</tbody>
      <tfoot><tr><td style="font-weight:700;border-top:1px solid var(--line-2)">Total</td>
        <td class="num" style="font-weight:700;border-top:1px solid var(--line-2);text-align:right;padding-right:12px">${uf(Math.round(totalUF))} UF</td></tr></tfoot></table></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px">
    <header><h3>Ficha de expedientes</h3><span class="hint">ordenados por criticidad</span><span class="spacer"></span>

const EVAL_ETAPAS=["Validación de la demanda","Antecedentes sociales","Antecedentes legales y dominio",
 "Levantamientos","Registros de calicatas","Factibilidades de servicios","Ingreso sanitario a SEREMI",

  const et = EVAL_ETAPAS.map((n,i)=>{
    const g=(ev.etapas||[]).find(x=>x.nombre===n) || (ev.etapas||[])[i] || {};
    return {nombre:n, estado:g.estado||"no", fecha:g.fecha||"", responsable:g.responsable||"", respaldo:g.respaldo||""};
  });
  return {bloques:bl, etapas:et};
}
function guardarEval(patch){

<script>
/* ============================================================
   IMPORTACIÓN / EXPORTACIÓN DE PLANILLAS  (SheetJS)
   Lee dos formatos:
   · "Planilla vinculada Control EGIS"  (hojas 1..8)
   · "ESTADOS DE EGIS FUTURO.xlsm"      (hoja 100%)
   ============================================================ */
const P_CIERRE="CIERRE-PV";
const MAP_ESTADOS={
  "1. Programas":"programas","2. Etapas":"etapas","3. Bloques":"bloques","4. Nómina":"nomina"
};
function isoD(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const s=String(v==null?"":v).trim();
  let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  m=s.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})\b/);
  if(m) return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  return "";
}
/* Una celda de avance -> {estado, fecha, nota}.
   vEstado: la celda de estado (o la celda única en la planilla vinculada).
   vFecha:  la columna de fecha aparte, cuando existe (formato ESTADOS xlsm). */
function celdaEtapa(vEstado,vFecha){
  const f = vFecha===undefined? "" : isoD(vFecha);
  const raw = (vEstado instanceof Date && !isNaN(vEstado)) ? "" : String(vEstado==null?"":vEstado).trim();
  const u = raw.toUpperCase();
  const salida=(estado,nota,fecha)=>({estado:estado, fecha: estado==="no"? "" : (fecha!==undefined?fecha:(f||isoD(raw))), nota:nota});

  if(/^N\s*\/\s*A$|^NO\s*APLICA$|^NO\s*CORRESPONDE$/.test(u)) return salida("na","No corresponde a este proyecto");
  if(vEstado instanceof Date && !isNaN(vEstado)) return salida("completa","", f || isoD(vEstado));
  if(!raw) return f? salida("completa","Registrado solo con fecha",f) : salida("no","");
  if(/^(PARCIAL|P)$/.test(u)) return salida("parcial","");
  if(/^(COMPLETA|C)$/.test(u)) return salida("completa","");
  if(u.includes("NO PAGO")) return salida("no",raw);
  if(u.includes("OK")) return salida("completa", u==="OK"?"":raw);
  if(u==="ONLINE"||u==="PENDIENTE"||u==="OFICINA"||u==="CASA PENDIENTE"||u.startsWith("ONLINE")) return salida("parcial",raw);
  if(u.includes("FALTA")) return /\d{2}[-\/]\d{2}/.test(u) ? salida("parcial",raw)
        : salida("no", (u==="FALTA"||u==="FALTAN")?"":raw);
  if(u.includes("SIN ")) return salida("no",raw);
  if(isoD(raw)) return salida("completa", raw.length>10?raw:"");
  if(/^\d{2}-?\d{6}$/.test(u)) return salida("completa","Fecha: "+raw);
  return salida("parcial",raw);
}
function siNo(v){ const u=String(v==null?"":v).trim().toUpperCase(); return u==="SI"||u==="SÍ"||u==="OK"||u==="X"||u==="TRUE"||u==="1"; }
function normComuna(v){
  let s=String(v==null?"":v).trim(); if(!s) return "";
  s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  const fix={"HUALANE":"Hualañé","LICANTEN":"Licantén","CUREPTO":"Curepto","TENO":"Teno","ROMERAL":"Romeral",
    "MOLINA":"Molina","SAGRADA FAMILIA":"Sagrada Familia","CURICO":"Curicó","RAUCO":"Rauco","VICHUQUEN":"Vichuquén",
    "SAN JAVIER":"San Javier","TALCA":"Talca","PENCAHUE":"Pencahue","CONSTITUCION":"Constitución"};
  return fix[s] || s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
}
function normEstadoProy(v){
  let s=String(v==null?"":v).replace(/_/g," ").trim().toUpperCase(); if(!s) return "";
  if(s.startsWith("CERRADO AL 100")) return "Cerrado al 100%";
  if(s.includes("CERRADO")&&s.includes("FALTA")) return "Cerrado, falta certificado 100%";
  if(s.startsWith("CERRADO")) return "Cerrado";
  if(s.startsWith("CERRAR")) return "Por cerrar";
  if(s.includes("FALTA CIERRE 100")) return "Falta cierre 100%";
  if(s.includes("FALTA CIERRE 50")) return "Falta cierre 50%";
  if(s.includes("FALTA CERTIFICADO50")||s.includes("FALTA CERTIFICADO 50")) return "Falta certificado 50%";
  if(s.includes("CERTIFICADO 100% PENDIENTE")) return "Certificado 100% pendiente";
  if(s.includes("PEDIR NO PAGO")) return "Pedir no pago";
  if(s.includes("RENUNCIA")) return "Renuncia";
  if(s==="50%LISTO") return "50% listo";
  if(s==="100%LISTO") return "100% listo";
  return s.charAt(0)+s.slice(1).toLowerCase();
}
const txt=v=>String(v==null?"":v).trim();
function filas(wbk,nombre){
  const ws=wbk.Sheets[nombre]; if(!ws) return [];
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,cellDates:true,defval:null});
}
function hojaQueEmpieza(wbk,re){ return wbk.SheetNames.filter(n=>re.test(n)); }
function codDeHoja(n){ const t=n.trim().split(/\s+/); return t[t.length-1]; }

/* ---------- construir el plan de cambios ---------- */
function planDesdePlanilla(wbk){
  const plan={programas:{},proyectos:{},avisos:[],origen:"Planilla vinculada"};
  const upProg=(cod)=>{ cod=txt(cod)||P_CIERRE;
    if(!plan.programas[cod]){
      const ex=S.progs.find(x=>(x.codigo||"")===cod);
      plan.programas[cod]=ex? JSON.parse(JSON.stringify(ex)) : {id:uid("pg"),codigo:cod,nombre:cod,etapas:[],bloques:[]};
    }
    return plan.programas[cod]; };

  // 1. Programas
  const fp=filas(wbk,"1. Programas");
  const esCodigo=v=>/^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$/.test(txt(v));
  for(let i=1;i<fp.length;i++){ const r=fp[i]; if(!r||!esCodigo(r[0])||!txt(r[1])) continue;
    const pg=upProg(r[0]);
    if(txt(r[1])) pg.nombre=txt(r[1]);
    if(txt(r[2])) pg.plazo=isoD(r[2]);
    if(txt(r[3])) pg.modalidad=txt(r[3]);
    if(txt(r[4])) pg.tipologia=txt(r[4]);
    if(txt(r[5])) pg.tipologiaUnica=siNo(r[5])?"si":"no";
    if(txt(r[6])) pg.tipologiaCodigo=txt(r[6]);
    if(txt(r[7])) pg.requiereNueva=siNo(r[7])?"si":"no";
    if(txt(r[8])) pg.justificacion=txt(r[8]);
    if(txt(r[9])) pg.coordinador=txt(r[9]);
    if(txt(r[10])) pg.contacto=txt(r[10]);
    if(txt(r[11])) pg.drive=txt(r[11]);
  }
  // 2. Etapas  (conserva ids por nombre para no perder avance)
  const fe=filas(wbk,"2. Etapas");
  if(fe.length>1){
    const porProg={};
    for(let i=1;i<fe.length;i++){ const r=fe[i]; if(!r||!esCodigo(r[0])||!txt(r[2])) continue;
      (porProg[txt(r[0])]=porProg[txt(r[0])]||[]).push({orden:parseFloat(r[1])||i,nombre:txt(r[2]),descripcion:txt(r[3]),responsable:txt(r[4])}); }
    Object.keys(porProg).forEach(cod=>{ const pg=upProg(cod);
      const previas=pg.etapas||[];
      pg.etapas=porProg[cod].sort((a,b)=>a.orden-b.orden).map(x=>{
        const vieja=previas.find(e=>e.nombre.toLowerCase()===x.nombre.toLowerCase());
        return {id:vieja?vieja.id:uid("e"),nombre:x.nombre,descripcion:x.descripcion||(vieja&&vieja.descripcion)||"",responsable:x.responsable||""};
      });
    });
  }
  // 3. Bloques
  const fb=filas(wbk,"3. Bloques");
  if(fb.length>1){
    const porProg={};
    for(let i=1;i<fb.length;i++){ const r=fb[i]; if(!r||!esCodigo(r[0])||!txt(r[1])) continue;
      (porProg[txt(r[0])]=porProg[txt(r[0])]||[]).push({nombre:txt(r[1]),descripcion:txt(r[2])}); }
    Object.keys(porProg).forEach(cod=>{ const pg=upProg(cod); const previas=pg.bloques||[];
      pg.bloques=porProg[cod].map(x=>{ const v=previas.find(b=>b.nombre.toLowerCase()===x.nombre.toLowerCase());
        return {id:v?v.id:uid("b"),nombre:x.nombre,descripcion:x.descripcion||(v&&v.descripcion)||""}; }); });
  }
  // 4. Nómina
  const fn=filas(wbk,"4. Nómina");
  for(let i=1;i<fn.length;i++){ const r=fn[i]; if(!r) continue;
    const cod=txt(r[0]), num=parseInt(r[1],10), nom=txt(r[5]);
    if(!esCodigo(cod)||!nom||isNaN(num)) continue;
    const pg=upProg(cod);
    const key=cod+"#"+num;
    const ex=S.proys.find(x=>x.programaId===pg.id && x.numero===num) ||
             S.proys.find(x=>x.programaId===pg.id && (x.postulante||"").toLowerCase()===nom.toLowerCase());
    const p=ex? JSON.parse(JSON.stringify(ex)) : {id:uid("p"),programaId:pg.id,etapas:{},bloques:{},obs:""};
    p.programaId=pg.id; p.numero=num; p.postulante=nom;
    p.codigo=txt(r[2])||p.codigo||""; p.comuna=normComuna(r[3])||p.comuna||"";
    p.localidad=txt(r[4])||p.localidad||""; p.rut=txt(r[6])||p.rut||"";
    p.rol=txt(r[7])||p.rol||""; p.contratista=txt(r[8])||p.contratista||"";
    p.responsable=txt(r[9])||p.responsable||""; p.estado=normEstadoProy(r[10])||p.estado||"";
    p.motivo=txt(r[11])||p.motivo||""; p.obs=txt(r[12])||p.obs||""; p.grupo=txt(r[13])||p.grupo||"";
    p._nuevo=!ex;
    plan.proyectos[key]=p;
  }
  // 9/10. Evaluación previa (secciones 3 y 4 del formato de traspaso)
  const fa=filas(wbk,hojaQueEmpieza(wbk,/antecedentes/i)[0]||"__");
  if(fa.length>1){
    for(let i=1;i<fa.length;i++){ const r=fa[i]; if(!r||!esCodigo(r[0])||!txt(r[1])) continue;
      const pg=upProg(r[0]); const ev=pg.evaluacion||{bloques:[],etapas:[]};
      const nom=txt(r[1]);
      const j=(ev.bloques||[]).findIndex(b=>b.nombre.toLowerCase()===nom.toLowerCase());
      const item={nombre:nom,contenido:txt(r[2]),cargado:siNo(r[3]),obs:txt(r[4])};
      if(j>=0) ev.bloques[j]=item; else (ev.bloques=ev.bloques||[]).push(item);
      ev.etapas=ev.etapas||[]; pg.evaluacion=ev;
    }
  }
  const fx=filas(wbk,hojaQueEmpieza(wbk,/etapas desarrolladas/i)[0]||"__");
  if(fx.length>1){
    for(let i=1;i<fx.length;i++){ const r=fx[i]; if(!r||!esCodigo(r[0])||!txt(r[1])) continue;
      const pg=upProg(r[0]); const ev=pg.evaluacion||{bloques:[],etapas:[]};
      const nom=txt(r[1]);
      const c=celdaEtapa(txt(r[2])||undefined, r[3]);
      const item={nombre:nom,estado:c.estado,fecha:c.estado==="no"?"":(isoD(r[3])||c.fecha),responsable:txt(r[4]),respaldo:txt(r[5])};
      const j=(ev.etapas||[]).findIndex(e=>e.nombre.toLowerCase()===nom.toLowerCase());
      if(j>=0) ev.etapas[j]=item; else (ev.etapas=ev.etapas||[]).push(item);
      ev.bloques=ev.bloques||[]; pg.evaluacion=ev;
    }
  }

  // 5/7. Avance   6/8. Documentos
  hojaQueEmpieza(wbk,/avance/i).forEach(hn=>{
    const cod=codDeHoja(hn), pg=plan.programas[cod]; if(!pg) return;
    const f=filas(wbk,hn); if(f.length<2) return;
    const cols=f[0].slice(2).map(txt);
    for(let i=1;i<f.length;i++){ const r=f[i]; if(!r) continue;
      const num=parseInt(r[0],10); if(isNaN(num)) continue;
      const p=plan.proyectos[cod+"#"+num] || (()=>{ const ex=S.proys.find(x=>x.programaId===pg.id&&x.numero===num);
        if(!ex) return null; const c=JSON.parse(JSON.stringify(ex)); plan.proyectos[cod+"#"+num]=c; return c; })();
      if(!p) continue;
      p.etapas=p.etapas||{};
      cols.forEach((cn,k)=>{ if(!cn) return;
        const et=(pg.etapas||[]).find(e=>e.nombre.toLowerCase()===cn.toLowerCase()); if(!et) return;
        const c=celdaEtapa(r[2+k], undefined);
        p.etapas[et.id]={estado:c.estado,fecha:c.fecha,responsable:(p.etapas[et.id]||{}).responsable||et.responsable||"",respaldo:c.nota};
      });
    }
  });
  hojaQueEmpieza(wbk,/docs|documentos/i).forEach(hn=>{
    const cod=codDeHoja(hn), pg=plan.programas[cod]; if(!pg) return;
    const f=filas(wbk,hn); if(f.length<2) return;
    const cols=f[0].slice(2).map(txt);
    for(let i=1;i<f.length;i++){ const r=f[i]; if(!r) continue;
      const num=parseInt(r[0],10); if(isNaN(num)) continue;
      const p=plan.proyectos[cod+"#"+num] || (()=>{ const ex=S.proys.find(x=>x.programaId===pg.id&&x.numero===num);
        if(!ex) return null; const c=JSON.parse(JSON.stringify(ex)); plan.proyectos[cod+"#"+num]=c; return c; })();
      if(!p) continue;
      p.bloques=p.bloques||{};
      cols.forEach((cn,k)=>{ if(!cn) return;
        const bl=(pg.bloques||[]).find(b=>b.nombre.toLowerCase()===cn.toLowerCase()); if(!bl) return;
        const v=r[2+k]; const on=siNo(v);
        p.bloques[bl.id]={cargado:on,fecha:on?((p.bloques[bl.id]||{}).fecha||todayISO()):"",obs:txt(v)};
      });
    }
  });
  return plan;
}
</script>

<script>
/* ---------- lector del archivo original: ESTADOS DE EGIS FUTURO.xlsm, hoja 100% ---------- */
const XLSM_ET=[
 ["Inicio de obras","INICIO OBRAS","INICIO OBRAS"],
 ["Recepción municipal (DOM)","FECHA R. DOM","FECHA R. DOM"],
 ["Acta de género","GENERO","FECHA GENERO"],
 ["Estado de pago 50%","50%","FECHA 50%"],
 ["Estado de pago antes 75%","ANTES 75%","FECHA ANTES 75%"],
 ["Estado de pago después 75%","DESPUÉS 75%","FECHA DESPUES 75%"],
 ["1ª postventa","1° Post Venta","Fecha 1° Post"],
 ["2ª postventa","2° Post Venta","Fecha 2° Post"],
 ["Uso, cuidado y mantención","Uso, Cuidado","Fecha UCM"],
 ["3ª postventa","3° Post Venta","Fecha 3°Post"],
 ["4ª postventa","4°Post Venta","Fecha 4°Post"],
 ["Plan de acompañamiento social AT5","Plan Acopañamiento T.S AT5",null],
 ["Informe final","Informe Final","Fecha IF"]];
const XLSM_BL=[
 ["Resolución de selección","RES. SELECCIÓN"],
 ["Resolución que aprueba","RES. APRUEBA"],
 ["Certificado de recepción municipal","N°RECEP.DOM"],
 ["Contrato con contratista","CONTRATISTA"],
 ["Certificado AT7","AT7"],
 ["Boletas del contratista","BOLETAS"]];

function planDesdeEstados(wbk){
  const hoja = wbk.SheetNames.includes("100%") ? "100%" : wbk.SheetNames.find(n=>/^100%/.test(n));
  const f=filas(wbk,hoja);
  if(f.length<2) throw new Error("La hoja «100%» no tiene filas de datos.");
  const H=f[0].map(txt);
  const ix=n=>H.indexOf(n);
  const g=(r,n)=>{ const i=ix(n); return i<0? null : r[i]; };
  if(ix("NOMBRE")<0) throw new Error("La hoja «100%» no trae la columna NOMBRE.");

  let pg=S.progs.find(x=>(x.codigo||"")===P_CIERRE) || S.progs.find(x=>/cierre/i.test(x.nombre||""));
  if(!pg){
    pg={id:uid("pg"),codigo:P_CIERRE,nombre:"EGIS Futuro · Cierre de obra y postventa",plazo:"",
        etapas:XLSM_ET.map(e=>({id:uid("e"),nombre:e[0]})),
        bloques:XLSM_BL.map(b=>({id:uid("b"),nombre:b[0],descripcion:""}))};
  } else {
    pg=JSON.parse(JSON.stringify(pg));
    XLSM_ET.forEach(e=>{ if(!(pg.etapas||[]).some(x=>x.nombre===e[0])) (pg.etapas=pg.etapas||[]).push({id:uid("e"),nombre:e[0]}); });
    XLSM_BL.forEach(b=>{ if(!(pg.bloques||[]).some(x=>x.nombre===b[0])) (pg.bloques=pg.bloques||[]).push({id:uid("b"),nombre:b[0],descripcion:""}); });
  }
  const plan={programas:{},proyectos:{},avisos:[],origen:"ESTADOS DE EGIS FUTURO · hoja "+hoja};
  plan.programas[P_CIERRE]=pg;
  const idEt=n=>(pg.etapas.find(e=>e.nombre===n)||{}).id;
  const idBl=n=>(pg.bloques.find(b=>b.nombre===n)||{}).id;

  let n=0; const usados=new Set();
  for(let i=1;i<f.length;i++){
    const r=f[i]; if(!r) continue;
    const nombre=txt(g(r,"NOMBRE")).replace(/\s+/g," "); if(!nombre) continue;
    n++;
    const codigo=txt(g(r,"CODIGO"));
    let ex = (codigo && S.proys.find(x=>x.programaId===pg.id && txt(x.codigo)===codigo && !usados.has(x.id)))
            || S.proys.find(x=>x.programaId===pg.id && (x.postulante||"").toLowerCase()===nombre.toLowerCase() && !usados.has(x.id));
    if(ex) usados.add(ex.id);
    const p = ex? JSON.parse(JSON.stringify(ex)) : {id:uid("p"),programaId:pg.id,etapas:{},bloques:{},obs:"",rol:"",responsable:""};
    p.programaId=pg.id; p.numero = ex? ex.numero : n; p.postulante=nombre; p.codigo=codigo||p.codigo||"";
    p.comuna=normComuna(g(r,"COMUNA"))||p.comuna||"";
    p.localidad=(txt(g(r,"LOCALIDAD"))||txt(g(r,"LOCALLIDAD"))||p.localidad||"").toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
    p.rut=txt(g(r,"RUT"))||p.rut||"";
    p.contratista=txt(g(r,"CONTRATISTA"))||txt(g(r,"E_CONSTRUCTORA"))||p.contratista||"";
    p.estado=normEstadoProy(g(r,"ESTADO PROYECTO"))||p.estado||"";
    p.motivo=txt(g(r,"Motivo"))||p.motivo||"";
    p.etapas=p.etapas||{}; p.bloques=p.bloques||{};
    XLSM_ET.forEach(([nom,cEst,cFec])=>{
      const id=idEt(nom); if(!id) return;
      const c=celdaEtapa(g(r,cEst), cFec? g(r,cFec) : undefined);
      p.etapas[id]={estado:c.estado,fecha:c.fecha,responsable:(p.etapas[id]||{}).responsable||"",respaldo:c.nota};
    });
    XLSM_BL.forEach(([nom,col])=>{
      const id=idBl(nom); if(!id) return;
      const v=txt(g(r,col));
      const on=!!v && !/^N\s*\/\s*A$/i.test(v) && !/FALTA/i.test(v) && !/NO PAGO/i.test(v);
      p.bloques[id]={cargado:on,fecha:(p.bloques[id]||{}).fecha||"",obs:v};
    });
    p._nuevo=!ex;
    plan.proyectos[P_CIERRE+"#"+p.numero+"#"+i]=p;
  }
  return plan;
}

/* ---------- diff y aplicación ---------- */
function resumirPlan(plan){
  const ps=Object.values(plan.proyectos);
  const nuevos=ps.filter(p=>p._nuevo).length;
  let cambios=0, campos=0;
  ps.forEach(p=>{
    const ex=S.proys.find(x=>x.id===p.id);
    if(!ex) return;
    let dif=false;
    ["postulante","comuna","localidad","codigo","rut","rol","contratista","responsable","estado","motivo","obs"].forEach(k=>{
      if((ex[k]||"")!==(p[k]||"")){ dif=true; campos++; }
    });
    Object.keys(p.etapas||{}).forEach(k=>{
      const a=(ex.etapas||{})[k]||{}, b=p.etapas[k]||{};
      if(a.estado!==b.estado || (a.fecha||"")!==(b.fecha||"")){ dif=true; campos++; }
    });
    Object.keys(p.bloques||{}).forEach(k=>{
      const a=(ex.bloques||{})[k]||{}, b=p.bloques[k]||{};
      if(!!a.cargado!==!!b.cargado){ dif=true; campos++; }
    });
    if(p.cc){ const A=JSON.stringify(ex.cc||{}), B=JSON.stringify(p.cc);
      if(A!==B){ dif=true; campos++; } }
    if(dif) cambios++;
  });
  const progs=Object.values(plan.programas).length;
  return {nuevos,cambios,campos,progs,total:ps.length};
}
function sellarFuentes(plan,nombreArchivo){
  const base=(nombreArchivo||"").toLowerCase();
  Object.values(plan.programas).forEach(pg=>{
    const fs=pg.fuentes||[];
    let tocada=false;
    fs.forEach(f=>{ const a=(f.archivo||"").toLowerCase();
      if(a && base && (base.includes(a) || a.includes(base.replace(/\.[a-z]+$/,"")))){
        f.ultimaCarga=new Date().toISOString(); if(f.uso==="pendiente") f.uso="activa"; tocada=true; } });
    if(!tocada && nombreArchivo){
      fs.push({parte:"Importado desde la página",archivo:nombreArchivo,hoja:"",ruta:"",
        nota:"Archivo cargado manualmente. Edita esta fila si quieres dejar anotada su ruta.",
        uso:"activa",ultimaCarga:new Date().toISOString()});
    }
    pg.fuentes=fs;
  });
}
async function aplicarPlan(plan,onProg){
  const progs=Object.values(plan.programas);
  const ps=Object.values(plan.proyectos);
  const total=progs.length+ps.length; let hecho=0;
  const limpio=o=>{ const c=JSON.parse(JSON.stringify(o)); delete c._nuevo; delete c.id; return c; };
  for(const pg of progs){
    if(S.db) await S.db.doc("programas/"+pg.id).set(limpio(pg));
    const i=S.progs.findIndex(x=>x.id===pg.id);
    if(i>=0) S.progs[i]=pg; else S.progs.push(pg);
    onProg(++hecho,total);
  }
  const lote=4;
  for(let i=0;i<ps.length;i+=lote){
    const grupo=ps.slice(i,i+lote);
    await Promise.all(grupo.map(async p=>{
      p.updatedAt=new Date().toISOString(); p.updatedBy=(S.autor||"importación")+" · planilla";
      if(S.db) await S.db.doc("proyectos/"+p.id).set(limpio(p));
      const j=S.proys.findIndex(x=>x.id===p.id);
      if(j>=0) S.proys[j]=p; else S.proys.push(p);
      onProg(++hecho,total);
    }));
    await new Promise(r=>setTimeout(r,120));
  }
}
</script>

<script>
/* ---------- lector de los dos archivos de cartera crítica ---------- */
const CC_PART=[["CSR","CSR base"],["Mejoramiento Vivienda","Mejoramiento de vivienda"],["Servicios Básicos","Servicios básicos"],
 ["Térmico","Acondicionamiento térmico"],["Eficiencia Energética","Eficiencia energética"],["Cocina","Cocina"],["Baño","Baño"],
 ["Nuevo Dormitorio","Nuevo dormitorio"],["Recinto Complementario","Recinto complementario"],["Entorno Inmediato","Entorno inmediato"],
 ["Entorno Comunitario","Entorno comunitario"],["Mejoramiento Terreno","Mejoramiento de terreno"],["Solucion Sanitaria","Solución sanitaria"],
 ["Requerimiento Arquitectónico Local","Requerimiento arquitectónico"],["Discapacidad","Discapacidad"],
 ["Construccion Existente","Construcción existente"],["Ahorro Aporte MINVU","Ahorro / aporte MINVU"]];
const numOf=v=>{ if(v==null||v==="") return null; const f=parseFloat(String(v).replace(",",".")); return isNaN(f)?null:(f%1?Math.round(f*100)/100:f); };
const claveNom=s=>nrmTxt(s).replace(/\s+/g," ").trim();
function nrmTxt(s){ return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function encabezado(f,clave){
  for(let i=0;i<Math.min(f.length,10);i++){ const v=(f[i]||[]).map(nrmTxt); if(v.includes(clave)) return i; }
  return -1;
}
function planDesdeCarteraCritica(wbk){
  const pg0 = S.progs.find(x=>/cartera cr/i.test(x.nombre||"")) || S.progs.find(x=>(x.codigo||"")==="CC-TEC");
  if(!pg0) throw new Error("No encuentro el programa de cartera crítica en el sistema. Créalo antes de importar.");
  const pg=JSON.parse(JSON.stringify(pg0));
  const plan={programas:{},proyectos:{},avisos:[],origen:""};
  plan.programas[pg.codigo||"CC-TEC"]=pg;
  const mios=S.proys.filter(p=>p.programaId===pg.id);
  const buscar=nom=>{ const k=claveNom(nom); return mios.find(p=>claveNom(p.postulante)===k); };
  const tocar=p=>{ const k=p.id; if(!plan.proyectos[k]) plan.proyectos[k]=JSON.parse(JSON.stringify(p)); return plan.proyectos[k]; };
  const hoy=new Date();
  let leidos=0, fuentes=[];

  // --- A. Nomina_CC (PHR_1_..xlsm): expediente, montos, RSH, déficit, edad
  const hn=wbk.SheetNames.find(n=>/^nomina[_\s-]*cc$/i.test(n.trim()));
  if(hn){
    fuentes.push("Nomina_CC");
    const f=filas(wbk,hn); const hi=encabezado(f,"NOMBRE");
    if(hi>=0){
      const H=f[hi].map(txt); const ix=n=>H.indexOf(n);
      const g=(r,n)=>{ const i=ix(n); return i<0?null:r[i]; };
      for(let i=hi+1;i<f.length;i++){ const r=f[i]; if(!r) continue;
        const nom=txt(g(r,"NOMBRE")).replace(/\s+/g," "); if(!nom||nrmTxt(nom).length<7) continue;
        const p=buscar(nom); if(!p){ plan.avisos.push("Sin ficha en el sistema: "+nom); continue; }
        const d=tocar(p); const c=Object.assign({},d.cc||{});
        const rut=txt(g(r,"RUT POSTULANTE")), dv=txt(g(r,"DV"));
        c.expediente=txt(g(r,"N° EXP."))||c.expediente||"";
        c.anio=txt(g(r,"AÑO"))||c.anio||""; c.egr=txt(g(r,"EGR EVALUANDO"))||c.egr||"";
        c.provincia=normComuna(g(r,"PROVINCIA"))||c.provincia||"";
        c.comuna=normComuna(g(r,"COMUNA"))||c.comuna||"";
        c.localidad=txt(g(r,"LOCALIDAD"))||c.localidad||"";
        c.edad=numOf(g(r,"EDAD"))??c.edad??null; c.igf=numOf(g(r,"N° IGF"))??c.igf??null;
        c.rsh=txt(g(r,"TRAMO RSH"))||c.rsh||"";
        c.deficit=(txt(g(r,"DÉFICIT HABITABILIDAD"))||c.deficit||"").replace(/^./,m=>m.toUpperCase()).toLowerCase().replace(/^./,m=>m.toUpperCase());
        c.factor=numOf(g(r,"FACTOR MULTIPLICADOR"))??c.factor??null;
        c.subsidio=numOf(g(r,"TOTAL SUBSIDIO"))??c.subsidio??null;
        c.ahorro=numOf(g(r,"AHORRO"))??c.ahorro??null;
        c.partidas=CC_PART.map(([col,lab])=>({nombre:lab,uf:numOf(g(r,col))||0})).filter(x=>x.uf);
        if(rut) d.rut=rut+"-"+dv;
        if(c.comuna) d.comuna=c.comuna;
        if(c.localidad) d.localidad=c.localidad;
        d.cc=c; d.codigo=c.expediente||d.codigo; leidos++;
      }
    }
  }
  // --- B. Cartera_Critica.xlsx: situación, predio, contacto, antigüedad
  const hojasCC=wbk.SheetNames.filter(n=>/cartera\s*cr[ií]tica/i.test(n));
  if(hojasCC.length){
    fuentes.push("Cartera_Critica");
    const regional=[];
    hojasCC.forEach(hoja=>{
      const esActual=/actual/i.test(hoja), esMaule=/maule/i.test(hoja);
      const f=filas(wbk,hoja); const hi=encabezado(f,"NOMBRE"); if(hi<0) return;
      const H=f[hi].map(txt);
      const col=(...ns)=>{ for(const n of ns){ const i=H.indexOf(n); if(i>=0) return i; } return -1; };
      const iN=col("NOMBRE"),iObs=col("OBSERVACIONES"),iObs2=col("FECHA RESOLUCION"),iFp=col("Fecha Post."),
        iDir=col("DIRECCION"),iFono=col("TELEFONO"),iRol=col("ROL AVALUO"),iMts=col("MTS"),
        iFoja=col("FOJA"),iNum=col("NUMERO"),iAno=col("AÑO"),iGf=col("GRUPO FAMILIAR"),
        iDef=col("DÉFICIT"),iRsh=col("RSH"),iEdad=col("EDAD"),iDisc=col("DISCAPACIDAD"),
        iEgr=col("ENTIDAD GESTION RURAL"),iSub=col("TOTAL SUBSIDIO"),iCom=col("COMUNA","Comuna"),
        iLoc=col("LOCALIDAD"),iCal=col("CALICATA","Calicata"),iCod=col("codigo");
      for(let i=hi+1;i<f.length;i++){ const r=f[i]; if(!r) continue;
        const nom=txt(r[iN]); if(!nom||nrmTxt(nom).length<7) continue;
        let obs=iObs>=0?txt(r[iObs]):"";
        if(!obs && iObs2>=0){ const v=txt(r[iObs2]); if(v && !/^[\d.,\s]+$/.test(v)) obs=v; }
        const p=buscar(nom);
        if(!p){
          if(esMaule && esActual) regional.push({nombre:nom.replace(/\s+/g," "),egr:iEgr>=0?txt(r[iEgr]):"",
            comuna:iCom>=0?normComuna(r[iCom]):"",localidad:iLoc>=0?txt(r[iLoc]):"",
            codigo:iCod>=0?txt(r[iCod]):"",subsidio:iSub>=0?numOf(r[iSub]):null,
            deficit:iDef>=0?(txt(r[iDef])||"").replace(/^(.)(.*)$/,(m,a,b)=>a.toUpperCase()+b.toLowerCase()):"",
            edad:iEdad>=0?numOf(r[iEdad]):null});
          continue;
        }
        const d=tocar(p); const c=Object.assign({},d.cc||{});
        const set=(k,v)=>{ if(v!=null && v!=="" ) c[k]=v; };
        if(obs) c.situacion=obs;
        if(iFp>=0) set("fechaPost", isoD(r[iFp]));
        if(iDir>=0) set("direccion", txt(r[iDir]));
        if(iFono>=0) set("fono", txt(r[iFono]));
        if(iRol>=0) set("rol", txt(r[iRol]));
        if(iMts>=0) set("superficie", numOf(r[iMts]));
        if(iGf>=0) set("grupoFamiliar", numOf(r[iGf]));
        if(iEdad>=0 && c.edad==null) set("edad", numOf(r[iEdad]));
        if(iRsh>=0 && !c.rsh) set("rsh", txt(r[iRsh]));
        if(iDef>=0 && !c.deficit) set("deficit", (txt(r[iDef])||"").replace(/^(.)(.*)$/,(m,a,b)=>a.toUpperCase()+b.toLowerCase()));
        if(iDisc>=0) set("discapacidad", txt(r[iDisc]).toUpperCase());
        if(iCal>=0) set("calicata", txt(r[iCal]));
        if(iFoja>=0 && iAno>=0 && txt(r[iFoja]) && txt(r[iAno]))
          c.inscripcion="Fojas "+txt(r[iFoja])+" N° "+(iNum>=0?txt(r[iNum]):"")+" año "+txt(r[iAno]);
        d.cc=c; leidos++;
      }
    });
    if(regional.length) pg.ccRegional=regional;
  }
  // antigüedad recalculada
  Object.values(plan.proyectos).forEach(d=>{
    const c=d.cc; if(!c) return;
    if(/^\d{4}-\d{2}-\d{2}$/.test(c.fechaPost||"")){
      c.esperaAnios=Math.round((hoy-new Date(c.fechaPost+"T12:00:00"))/31557600000*10)/10;
    } else if(/^\d{4}$/.test(String(c.anio||""))){
      c.esperaAnios=Math.round((hoy.getFullYear()-Number(c.anio)+(hoy.getMonth())/12)*10)/10;
    }
  });
  pg.ccFuentes=fuentes.join(" + ");
  plan.origen="Cartera crítica · "+fuentes.join(" + ");
  if(!leidos) throw new Error("El archivo no trae filas reconocibles de cartera crítica.");
  return plan;
}
</script>

<script>
/* ---------- interfaz de importación ---------- */
let PLAN=null;
function abrirImportador(){
  const m=$("#modal");
  m.innerHTML=`
   <header><div style="flex:1"><div class="eyebrow">Sincronizar desde Excel</div><h3>Importar planilla</h3></div>
     <button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></header>
   <div class="mbody">
     <div class="drop" id="drop">Arrastra aquí el archivo, o haz clic para buscarlo<br>
       <span style="font-size:11.5px">Acepta la <b>planilla vinculada</b>, <b>ESTADOS DE EGIS FUTURO.xlsm</b>, <b>PHR_1_CSR_Cartera_Critica_2026.xlsm</b> y <b>Cartera_Critica.xlsx</b></span></div>
     <div class="log" id="implog" style="display:none"></div>
     <div class="prog" id="impprog" style="display:none"><i></i></div>
   </div>
   <footer><button class="btn" onclick="cerrarModal()">Cancelar</button>
     <button class="btn pri" id="btnAplicar" style="display:none" onclick="confirmarImport()">Aplicar cambios</button></footer>`;
  m.classList.add("on"); m.setAttribute("aria-hidden","false"); $("#scrim2").classList.add("on");
  const drop=$("#drop"), inp=$("#fileIn");
  drop.onclick=()=>inp.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("hot");};
  drop.ondragleave=()=>drop.classList.remove("hot");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("hot"); if(e.dataTransfer.files[0]) leerArchivo(e.dataTransfer.files[0]);};
  inp.onchange=()=>{ if(inp.files[0]) leerArchivo(inp.files[0]); inp.value=""; };
}
function cerrarModal(){ const m=$("#modal"); m.classList.remove("on"); m.setAttribute("aria-hidden","true"); $("#scrim2").classList.remove("on"); PLAN=null; }
function logImp(html){ const l=$("#implog"); if(!l) return; l.style.display="block"; l.innerHTML=html; }

async function leerArchivo(file){
  if(typeof XLSX==="undefined"){ logImp('<b style="color:var(--crit)">No se pudo cargar el lector de Excel.</b> Revisa tu conexión y vuelve a intentarlo.'); return; }
  logImp("Leyendo <b>"+esc(file.name)+"</b>…");
  try{
    const buf=await file.arrayBuffer();
    const wbk=XLSX.read(buf,{type:"array",cellDates:true});
    let plan;
    if(wbk.SheetNames.some(n=>/^4\.\s*N[oó]mina/i.test(n))) plan=planDesdePlanilla(wbk);
    else if(wbk.SheetNames.some(n=>/^100%$/.test(n.trim()))) plan=planDesdeEstados(wbk);
    else if(wbk.SheetNames.some(n=>/^nomina[_\s-]*cc$/i.test(n.trim())) || wbk.SheetNames.some(n=>/cartera\s*cr[ií]tica/i.test(n)))
      plan=planDesdeCarteraCritica(wbk);
    else throw new Error("No reconozco este archivo. Debe ser la planilla vinculada («4. Nómina»), ESTADOS DE EGIS FUTURO.xlsm («100%»), PHR_1_CSR_Cartera_Critica_2026.xlsm («Nomina_CC») o Cartera_Critica.xlsx.");
    PLAN=plan; PLAN.archivo=file.name;
    const d=resumirPlan(plan);
    const pgs=Object.values(plan.programas).map(p=>esc(p.nombre)+" ("+(p.etapas||[]).length+" etapas, "+(p.bloques||[]).length+" bloques)").join("<br>");
    logImp(`<b>${esc(file.name)}</b><br><span style="color:var(--ink-3)">Formato detectado: ${esc(plan.origen)}</span>
      <div class="diff" style="margin:10px 0">
        <div><div class="k">Proyectos leídos</div><div class="v">${d.total}</div></div>
        <div><div class="k">Nuevos</div><div class="v" style="color:${d.nuevos?"var(--accent)":"var(--ink-3)"}">${d.nuevos}</div></div>
        <div><div class="k">Con cambios</div><div class="v" style="color:${d.cambios?"var(--warn)":"var(--ink-3)"}">${d.cambios}</div></div>
        <div><div class="k">Celdas modificadas</div><div class="v">${d.campos}</div></div>
      </div>
      <b>Programas:</b><br>${pgs}
      ${d.nuevos+d.cambios===0?'<br><br><b style="color:var(--good)">Todo coincide con lo que ya está cargado.</b> No hay nada que aplicar.':""}`);
    $("#btnAplicar").style.display = (d.nuevos+d.cambios)?"inline-flex":"none";
  }catch(e){
    PLAN=null; $("#btnAplicar").style.display="none";
    logImp('<b style="color:var(--crit)">No se pudo leer el archivo.</b><br>'+esc(e.message||String(e)));
  }
}
async function confirmarImport(){
  if(!PLAN) return;
  const btn=$("#btnAplicar"); btn.disabled=true; btn.textContent="Aplicando…";
  const bar=$("#impprog"); bar.style.display="block";
  try{
    sellarFuentes(PLAN, PLAN.archivo||"");
    await aplicarPlan(PLAN,(h,t)=>{ bar.firstElementChild.style.width=Math.round(h/t*100)+"%"; });
    logImp('<b style="color:var(--good)">Listo.</b> Los datos quedaron actualizados para todo el equipo.');
    btn.style.display="none";
    ordenarProgs(); render();
    setTimeout(cerrarModal,1400);
  }catch(e){
    logImp('<b style="color:var(--crit)">Se interrumpió la carga.</b><br>'+esc(e.message||e.code||String(e))+'<br>Los proyectos ya escritos quedaron guardados; vuelve a importar el archivo para completar el resto.');
    btn.disabled=false; btn.textContent="Reintentar";
  }
}

/* ---------- exportar la planilla vinculada ---------- */
async function exportarPlanilla(){
  if(typeof XLSX==="undefined"){ aviso("No se pudo cargar el generador de Excel."); return; }
  if(!S.dl){ aviso("La descarga de archivos no está disponible en esta vista."); return; }
  const wbk=XLSX.utils.book_new();
  const add=(nombre,aoa,anchos)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa);
    if(anchos) ws["!cols"]=anchos.map(w=>({wch:w}));
    ws["!freeze"]={xSplit:0,ySplit:1};
    XLSX.utils.book_append_sheet(wbk,ws,nombre.slice(0,31)); };

  add("0. Léeme",[["PLANILLA VINCULADA · Control EGIS Maule"],
    ["Exportada el "+new Date().toLocaleString("es-CL")],[],
    ["Completa las celdas vacías y vuelve a importar este archivo desde la página."],
    ["En las hojas de avance: escribe la fecha de cierre (AAAA-MM-DD), o Parcial, o deja vacío."],
    ["En las hojas de documentos: escribe Sí cuando el respaldo esté cargado."]],[110]);

  add("1. Programas",[["Código","Nombre del programa","Plazo comprometido","Modalidad DS10","Tipología en uso",
      "¿Tipología única?","Código / versión planimetría","¿Requiere nueva tipología?","Justificación",
      "Responsable de coordinación","Contacto","Link carpeta de respaldos"]].concat(
    S.progs.map(p=>[p.codigo||"",p.nombre||"",p.plazo||"",p.modalidad||"",p.tipologia||"",
      p.tipologiaUnica==="si"?"Sí":(p.tipologiaUnica==="no"?"No":""),p.tipologiaCodigo||"",
      p.requiereNueva==="si"?"Sí":(p.requiereNueva==="no"?"No":""),p.justificacion||"",
      p.coordinador||"",p.contacto||"",p.drive||""])),[14,40,20,24,22,15,22,17,30,24,26,34]);

  const et=[["Programa","Orden","Etapa","Descripción o criterio de cierre","Responsable por defecto"]];
  const bl=[["Programa","Bloque documental","Contenido esperado"]];
  S.progs.forEach(pg=>{ (pg.etapas||[]).forEach((e,i)=>et.push([pg.codigo||"",i+1,e.nombre,e.descripcion||"",e.responsable||""]));
                        (pg.bloques||[]).forEach(b=>bl.push([pg.codigo||"",b.nombre,b.descripcion||""])); });
  add("2. Etapas",et,[14,9,44,58,26]); add("3. Bloques",bl,[14,34,72]);

  const nom=[["Programa","N°","Código","Comuna","Localidad","Postulante","RUT","Rol SII","Contratista",
              "Responsable a cargo","Estado declarado","Motivo","Observaciones","Grupo"]];
  S.progs.forEach(pg=> S.proys.filter(p=>p.programaId===pg.id).sort((a,b)=>(a.numero||0)-(b.numero||0)).forEach(p=>
    nom.push([pg.codigo||"",p.numero||"",p.codigo||"",p.comuna||"",p.localidad||"",p.postulante||"",p.rut||"",
              p.rol||"",p.contratista||"",p.responsable||"",p.estado||"",p.motivo||"",p.obs||"",p.grupo||""])));
  add("4. Nómina",nom,[13,7,11,16,18,34,14,13,30,22,26,18,30,18]);

  let n=5;
  S.progs.forEach(pg=>{
    const ps=S.proys.filter(p=>p.programaId===pg.id).sort((a,b)=>(a.numero||0)-(b.numero||0));
    const av=[["N°","Postulante (referencia)"].concat((pg.etapas||[]).map(e=>e.nombre))];
    ps.forEach(p=> av.push([p.numero||"",p.postulante||""].concat((pg.etapas||[]).map(e=>{
      const v=(p.etapas||{})[e.id]||{};
      return v.estado==="completa" ? (v.fecha||"Completa") : (v.estado==="parcial"?"Parcial":(v.estado==="na"?"No corresponde":""));
    }))));
    add(n+". Avance "+(pg.codigo||""),av,[8,34].concat((pg.etapas||[]).map(()=>15))); n++;
    const dc=[["N°","Postulante (referencia)"].concat((pg.bloques||[]).map(b=>b.nombre))];
    ps.forEach(p=> dc.push([p.numero||"",p.postulante||""].concat((pg.bloques||[]).map(b=>
      ((p.bloques||{})[b.id]||{}).cargado?"Sí":""))));
    add(n+". Docs "+(pg.codigo||""),dc,[8,34].concat((pg.bloques||[]).map(()=>15))); n++;
  });

  const ant=[["Programa","Bloque","Contenido a cargar","¿Cargado? (Sí/No)","Observación"]];
  const eds=[["Programa","Etapa","Estado (Completa/Parcial/vacío)","Fecha","Responsable","Respaldo / ubicación"]];
  S.progs.forEach(pg=>{ const ev=evalDe(pg);
    ev.bloques.forEach(b=> ant.push([pg.codigo||"",b.nombre,b.contenido,b.cargado?"Sí":"",b.obs||""]));
    ev.etapas.forEach(e=> eds.push([pg.codigo||"",e.nombre, e.estado==="completa"?"Completa":(e.estado==="parcial"?"Parcial":""), e.fecha||"", e.responsable||"", e.respaldo||""]));
  });
  add(n+". Antecedentes",ant,[13,18,66,17,30]); n++;
  add(n+". Etapas desarrolladas",eds,[13,34,22,14,20,30]);

  const out=XLSX.write(wbk,{bookType:"xlsx",type:"array"});
  try{
    await S.dl.save({filename:"Planilla_Control_EGIS_"+todayISO()+".xlsx",data:out});
    const el=$("#syncState"); el.textContent="Planilla exportada"; setTimeout(estadoSync,3500);
  }catch(e){ if(e&&e.code==="declined") return; aviso("No se pudo guardar la planilla."); }
}
</script>

<script>
/* ---------------- NAVEGACIÓN / ARRANQUE ---------------- */
function ir(v){ S.view=v; syncNav(); render(); window.scrollTo({top:0}); }
function syncNav(){ document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("on", b.dataset.v===S.view)); }
document.querySelectorAll(".navbtn").forEach(b=> b.addEventListener("click",()=>ir(b.dataset.v)));

$("#themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark? "light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("egis.tema",next); }catch(err){}
});
try{ const t=localStorage.getItem("egis.tema"); if(t) document.documentElement.setAttribute("data-theme",t);
     S.autor=localStorage.getItem("egis.autor")||""; }catch(e){}

function ordenarProgs(){ S.progs.sort((a,b)=> String(a.nombre).localeCompare(String(b.nombre),"es")); }

/* el arranque vive en el bloque de carga de datos.json */
</script>
<script>
/* ============================================================
   Control EGIS · versión en vivo
   Lee datos.json cada vez que se abre la página (y cada 2 min).
   El archivo lo genera y sube escanear.py desde el computador de la EGIS.
   ============================================================ */
const DATOS = {programas:[], proyectos:[], corte:""};
const FUENTE = "datos.json";

function bannerError(msg){
  const v = document.getElementById("view");
  if(v) v.innerHTML = '<div class="panel"><div class="empty">'
    + '<p style="font-size:15px;color:var(--ink);font-weight:600;margin:0 0 6px">No se pudieron cargar los datos</p>'
    + '<p style="margin:0 0 4px">' + msg + '</p>'
    + '<p style="margin:0;font-size:12px;color:var(--ink-3)">Se lee el archivo <span class="mono">' + FUENTE + '</span> publicado junto a esta página.</p>'
    + '</div></div>';
}

async function traerDatos(){
  const r = await fetch(FUENTE + "?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("El servidor respondió " + r.status + ".");
  const d = await r.json();
  if(!d || !Array.isArray(d.programas) || !Array.isArray(d.proyectos)) throw new Error("El archivo llegó con un formato inesperado.");
  return d;
}

function aplicar(d){
  const antes = S.progId;
  DATOS.programas = d.programas; DATOS.proyectos = d.proyectos; DATOS.corte = d.corte || "";
  S.progs = d.programas; S.proys = d.proyectos;
  S.progId = (antes && d.programas.some(p=>p.id===antes)) ? antes : (d.programas[0] && d.programas[0].id);
  S.ready = true;
  const e = document.getElementById("syncState");
  if(e) e.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px">'
    + '<i style="width:7px;height:7px;border-radius:50%;background:var(--good);display:block"></i>'
    + 'En vivo · ' + esc(DATOS.corte) + '</span>';
  render();
}

(function init(){
  S.db = null; S.dl = null;
  traerDatos().then(aplicar).catch(e=>{
    S.ready = true;
    const s = document.getElementById("syncState");
    if(s) s.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px">'
      + '<i style="width:7px;height:7px;border-radius:50%;background:var(--crit);display:block"></i>Sin conexión al archivo</span>';
    bannerError(esc(e.message));
  });
  // refresco silencioso mientras la pestaña queda abierta
  setInterval(()=>{ if(document.visibilityState==="visible") traerDatos().then(aplicar).catch(()=>{}); }, 120000);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible") traerDatos().then(aplicar).catch(()=>{});
  });
})();
</script>
</body>
